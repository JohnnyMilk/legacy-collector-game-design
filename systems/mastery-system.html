<!doctype html><html lang="zh-Hant" data-doc="../docs/systems/mastery-system.md?v=20260830-1646"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastery System · LEGACY COLLECTOR</title><link rel="stylesheet" href="../site.css?v=20260830-1628"><link rel="stylesheet" href="mastery-system.css?v=20260829-0825"></head><body><header class="topbar"><a class="brand" href="../index.html">LEGACY COLLECTOR</a><a href="../index.html">文件索引</a></header><main class="shell"><div class="eyebrow">Systems / Design Document</div><article class="doc" data-doc-content></article><section class="prototype mastery-demo" data-mastery-demo><div class="prototype-heading"><div><span class="prototype-kicker">Prototype 03 · Tier 3 已完成</span><h2>職業熟練設計瀏覽器</h2><p>Tier 3 現行固定為 8 個高階職業：4 個單系核心 + 4 個跨系；8 個職業的一般攻擊、專屬能力與 Mastery 均已完成確認。</p></div><span class="prototype-status confirmed">已完成</span></div><div data-tier-sections></div></section></main><script src="../site.js?v=20260830-1628"></script><script>(async()=>{const root=document.querySelector('[data-mastery-demo]'),host=root?.querySelector('[data-tier-sections]');if(!root||!host)return;let data,rules;try{const [a,b]=await Promise.all([fetch('../data/classes.json?v=20260830-1646'),fetch('../data/mastery-rules.json?v=20260829-0825')]);if(!a.ok||!b.ok)throw new Error();data=await a.json();rules=await b.json()}catch(e){host.innerHTML='<article class="mastery-card"><h3>資料讀取失敗</h3><p>請重新整理頁面。</p></article>';return}const scoutAttack=data.classDesigns?.tier1_scout?.basicAttack;if(scoutAttack)Object.assign(scoutAttack,{name:'物理射擊',range:2,damageType:'physical',attackStyle:'ranged',effect:'對 2 格內單一敵人進行遠距物理普通攻擊。'});const sectorNames={warrior:'戰士系',agile:'敏捷系',magic:'魔法系',support:'支援系'};const sectorLabel=c=>(c.sectors||[c.sector]).map(s=>sectorNames[s]||s).join(' × ');const damageNames={physical:'物理',magic:'魔法',healing:'治療'};const styleNames={melee:'近戰',ranged:'遠距','reach-melee':'長柄近戰','directional-melee':'方向近戰','front-row-cleave':'前方橫列斬擊','straight-line-ranged':'直線遠距','melee-support':'近戰支援'};const categoryNames={common:'共通','class-playstyle':'職業玩法','passive-skill':'被動技能','active-skill':'主動技能'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const rows=data.classes.filter(c=>c.tier>0).map(c=>({...c}));function cardFor(c){const d=data.classDesigns?.[c.id],hasDesign=!!d,confirmed=d?.status==='confirmed',draft=d?.status==='draft';const basic=d?.basicAttack,passives=Array.isArray(d?.passiveSkills)?d.passiveSkills:(d?.passiveSkill?[d.passiveSkill]:[]),actives=Array.isArray(d?.activeSkills)?d.activeSkills:(d?.activeSkill?[d.activeSkill]:[]),list=d?.masteryChecklist||[];const card=document.createElement('article');card.className=`mastery-card sector-${c.sector}${confirmed?' is-confirmed':draft?' is-draft':''}`;const draftLabel=list.length?'<span class="design-status pending">DRAFT · 規則待定</span>':'<span class="design-status pending">DRAFT · Mastery 待設計</span>';const conceptLabel=c.tier===3&&c.conceptStatus==='provisional'?'<span class="design-status pending">CONCEPT · 暫定</span>':'<span class="design-status pending">待定義</span>';const status=confirmed?'<span class="design-status confirmed">CONFIRMED</span>':draft?draftLabel:conceptLabel;const basicHtml=hasDesign&&basic?`<strong>${esc(basic.name||'一般攻擊')}</strong><span>${esc(basic.effect||'—')}</span><div class="mastery-meta">射程：${esc(basic.range??'—')} 格 · ${esc(damageNames[basic.damageType]||basic.damageType||'—')} · ${esc(styleNames[basic.attackStyle]||basic.attackStyle||'—')}</div>`:'<strong>待定義</strong><span>一般攻擊型態、射程與傷害類型尚未定義。</span>';const activeHtml=actives.length?actives.map(a=>`<div><strong>${esc(a.name||'—')}</strong><span>${esc(a.effect||'—')}</span><div class="mastery-meta">Charge：${esc(a.maxCharges??'—')}</div></div>`).join(''):hasDesign&&d?.exclusiveAbilityPattern==='two-passives-no-active'?'<strong>無額外 Tier 3 專屬主動</strong><span>此職業以 2 個 Tier 3 專屬被動取代額外 Charge 3 主動；合法繼承主動技能仍照常保留。</span>':c.tier===3?'<strong>Tier 3 專屬能力待定義</strong><span>預設可採 Charge 3 主動，但個別職業允許其他專屬能力組合。</span>':'<strong>待定義</strong><span>主動技能名稱、效果與 Charge 尚未定義。</span>';const passiveHtml=passives.length?passives.map(p=>`<div><strong>${esc(p.name||'—')}</strong><span>${esc(p.effect||'—')}</span></div>`).join(''):hasDesign&&d?.exclusiveAbilityPattern==='two-actives-no-passive'?'<strong>無額外 Tier 3 專屬被動</strong><span>此職業以 2 個 Tier 3 專屬主動技能構成專屬能力組合；合法繼承被動技能仍照常保留。</span>':c.tier===3?'<strong>Tier 3 專屬被動待定義</strong><span>將依 Inspiration Links 的既有技能組合設計。</span>':'<strong>待定義</strong><span>被動技能名稱與效果尚未定義。</span>';let masteryHtml;if(list.length){masteryHtml=`<ol class="checklist${confirmed?'':' pending-list'}">${list.map(x=>`<li>${esc(x.description)} <strong>${esc(x.target)} ${esc(x.unit)}</strong><span class="kind">${esc(categoryNames[x.category]||x.category)}</span></li>`).join('')}</ol>`}else if(c.tier===3){masteryHtml='<div class="skill-box"><strong>Tier 3 Mastery：只驗證專屬能力</strong><span>不使用戰鬥場次或 Elite / Boss 共通任務；項目數依該職業專屬能力的學習目標決定。</span></div>'}else if(c.tier===2){const t=rules.tier2.commonTargets;masteryHtml=`<ol class="checklist pending-list"><li>使用該職業完成戰鬥 <strong>${t.battlesCompleted} 場</strong><span class="kind">共通</span></li><li>使用該職業擊倒敵人 <strong>${t.kills} 名</strong><span class="kind">共通</span></li><li>使用該職業參與擊敗 Elite / Boss <strong>${t.eliteBossParticipation} 次</strong><span class="kind">共通</span></li><li>職業玩法任務：待設計</li><li>被動技能任務：待設計</li><li>主動技能任務：待設計</li></ol>`}else{masteryHtml='<ol class="checklist pending-list"><li>共通任務 1：待定義</li><li>共通任務 2：待定義</li><li>共通任務 3：待定義</li><li>職業玩法任務：待定義</li><li>被動技能任務：待定義</li><li>主動技能任務：待定義</li></ol>'}card.innerHTML=`<div class="mastery-card-head"><div><div class="mastery-tier-label">Tier ${esc(c.tier)} · ${esc(sectorLabel(c))}</div><h3>${esc(c.name)}</h3></div>${status}</div><dl class="class-facts"><div><dt>所屬職業系</dt><dd>${esc(sectorLabel(c))}</dd></div><div><dt>職業定位</dt><dd>${esc(c.role||'待定義')}</dd></div><div class="wide"><dt>職業特性</dt><dd>${esc(c.trait||'待定義')}</dd></div></dl><div class="mastery-section"><h4>一般攻擊</h4><div class="skill-box">${basicHtml}</div></div><div class="mastery-section"><h4>主動技能</h4><div class="skill-box">${activeHtml}</div></div><div class="mastery-section"><h4>被動技能</h4><div class="skill-box">${passiveHtml}</div></div><div class="mastery-section"><h4>熟練度任務</h4>${masteryHtml}</div>`;return card}for(const tier of [1,2,3]){const tierRows=rows.filter(c=>c.tier===tier).sort((a,b)=>(a.angle??0)-(b.angle??0));const section=document.createElement('section');section.className='mastery-tier-section';section.innerHTML=`<div class="tier-heading"><div><span class="tier-kicker">TIER ${tier}</span><h3>Tier ${tier} 職業</h3></div><div class="tier-actions"><button class="mastery-nav" data-prev>‹</button><button class="mastery-nav" data-next>›</button></div></div><div class="mastery-track" data-track></div>`;const track=section.querySelector('[data-track]');tierRows.forEach(c=>track.appendChild(cardFor(c)));const step=()=>Math.min(track.clientWidth*.9,580);section.querySelector('[data-prev]').onclick=()=>track.scrollBy({left:-step(),behavior:'smooth'});section.querySelector('[data-next]').onclick=()=>track.scrollBy({left:step(),behavior:'smooth'});host.appendChild(section)}})();</script></body></html>
