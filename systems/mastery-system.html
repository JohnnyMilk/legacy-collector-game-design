<!doctype html><html lang="zh-Hant" data-doc="../docs/systems/mastery-system.md?v=20260823-0857"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastery System · Legacy Collector</title><link rel="stylesheet" href="../site.css?v=20260823-0857"><link rel="stylesheet" href="mastery-system.css?v=20260823-0857"></head><body><header class="topbar"><a class="brand" href="../index.html">LEGACY COLLECTOR</a><a href="../index.html">文件索引</a></header><main class="shell"><div class="eyebrow">Systems / Design Document</div><article class="doc" data-doc-content></article><section class="prototype mastery-demo" data-mastery-demo><div class="prototype-heading"><div><span class="prototype-kicker">Prototype 03 · 進行中</span><h2>職業熟練設計瀏覽器</h2><p>左右滑動查看各職業。已定案職業顯示完整主動／被動技能與 6 項 Mastery；尚未討論的職業只保留既有定位，不預先猜技能。</p></div><span class="prototype-status progress">設計中</span></div><p class="mastery-progress-note">目前採 Framework First：先固定共用資料格式與 UI，再逐職業確認內容。斥候為第一個 confirmed 範本。</p><div class="mastery-browser"><button class="mastery-nav" data-prev aria-label="上一個職業">‹</button><div class="mastery-track" data-mastery-track aria-label="職業熟練度橫向瀏覽"></div><button class="mastery-nav" data-next aria-label="下一個職業">›</button></div></section></main><script src="../site.js?v=20260823-0857"></script><script>(async()=>{const root=document.querySelector('[data-mastery-demo]'),track=root?.querySelector('[data-mastery-track]');if(!root||!track)return;let data;try{const res=await fetch('../data/classes.json?v=20260823-0857');if(!res.ok)throw new Error(res.status);data=await res.json()}catch(e){track.innerHTML='<article class="mastery-card"><h3>資料讀取失敗</h3><p>請重新整理頁面。</p></article>';return}const classRows=data.classes.filter(c=>c.tier>0).sort((a,b)=>a.tier-b.tier||a.angle-b.angle);const sectorNames={warrior:'戰士系',agile:'敏捷系',magic:'魔法系',support:'支援系'};const categoryNames={common:'共通','class-playstyle':'職業玩法','passive-skill':'被動技能','active-skill':'主動技能'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));for(const c of classRows){const d=data.classDesigns?.[c.id],confirmed=d?.status==='confirmed';const passive=d?.passiveSkill,active=d?.activeSkill,list=d?.masteryChecklist||[];const card=document.createElement('article');card.className='mastery-card'+(confirmed?' is-confirmed':'');const status=confirmed?'<span class="design-status confirmed">CONFIRMED</span>':'<span class="design-status pending">待定義</span>';const skills=confirmed?`<div class="skill-row"><div class="skill-box"><strong>被動｜${esc(passive?.name||'—')}</strong><span>${esc(passive?.effect||'—')}</span></div><div class="skill-box"><strong>主動｜${esc(active?.name||'—')}</strong><span>${esc(active?.effect||'—')}</span>${active?.maxCharges?`<div class="mastery-meta">Charge：${esc(active.maxCharges)}</div>`:''}</div></div>`:'<p class="mastery-empty">主動技能與被動技能尚未討論。依框架確認後再寫入，不使用暫定假技能補滿。</p>';const mastery=confirmed?`<ol class="checklist">${list.map(x=>`<li>${esc(x.description)} <strong>${esc(x.target)} ${esc(x.unit)}</strong><span class="kind">${esc(categoryNames[x.category]||x.category)}</span></li>`).join('')}</ol><p class="mastery-note">${esc(d.masteryBalanceNote||'')}</p>`:'<p class="mastery-empty">6 項 Mastery 尚未定義。最終仍採 3 共通 + 3 職業專屬，目標約兩個 Run 自然完成。</p>';card.innerHTML=`<div class="mastery-card-head"><div><div class="mastery-tier-label">Tier ${esc(c.tier)} · ${esc(sectorNames[c.sector]||c.sector)}</div><h3>${esc(c.name)}</h3><div class="mastery-meta">${esc(d?.combatRole||c.role||'')}</div></div>${status}</div><div class="feature-copy"><strong>職業特性／玩法說明</strong><br>${esc(d?.featureDescription||c.trait||c.summary||'—')}</div><div class="mastery-section"><h4>主動技能 / 被動技能</h4>${skills}</div><div class="mastery-section"><h4>Mastery Checklist</h4>${mastery}</div>`;track.appendChild(card)}const step=()=>Math.min(track.clientWidth*.9,580);root.querySelector('[data-prev]').onclick=()=>track.scrollBy({left:-step(),behavior:'smooth'});root.querySelector('[data-next]').onclick=()=>track.scrollBy({left:step(),behavior:'smooth'})})();</script></body></html>
