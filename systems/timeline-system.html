<!doctype html><html lang="zh-Hant" data-doc="../docs/systems/timeline-system.md"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行動時間軸系統 · Legacy Collector</title><link rel="stylesheet" href="../site.css"><link rel="stylesheet" href="timeline-system.css"></head><body><header class="topbar"><a class="brand" href="../index.html">LEGACY COLLECTOR</a><a href="../index.html">文件索引</a></header><main class="shell"><div class="eyebrow">系統 / 戰鬥</div><article class="doc" data-doc-content></article><section class="prototype timeline-demo" data-timeline-demo><div class="prototype-heading"><div><span class="prototype-kicker">Prototype 01 · 更新日期 2026-08-21</span><h2>Timeline Simulator</h2><p>驗證回合制時間軸、遺產優先權與復活規則。</p></div><span class="prototype-status live">實作中</span></div><div class="timeline-tabs"><button data-tab="turn">回合制</button><button data-tab="linear">線性行動制（廢棄）</button></div><section data-mode="turn"><div class="timeline-status"><div><strong>回合</strong><span data-round>1</span></div><div><strong>行動中</strong><span data-active>—</span></div><div><strong>未行動</strong><span data-remaining>0</span></div></div><div class="timeline-toolbar"><button data-action="reset">重新產生</button><button data-action="next-round">重新計算下回合</button><button data-action="relic">裝備/取消 王者遺產</button></div><div class="timeline-layout"><div class="timeline-panel"><h3>行動順序</h3><ol class="order-list" data-order></ol></div><div class="timeline-panel timeline-controls"><h3>玩家動作</h3><select data-target></select><div class="button-group"><button data-action="end">結束回合</button><button data-action="haste">自己加速 +2</button><button data-action="slow">敵方減速 -2</button><button data-action="defeat">擊倒敵方</button><button data-action="kill-player">擊倒我方1</button><button data-action="revive">復活我方1</button><button data-action="enemy">執行敵方行動</button></div></div></div></section><section data-mode="linear" hidden><div class="timeline-panel"><h3>線性行動制（廢棄）</h3><p>曾測試敏捷差距造成連續行動，但
