<!doctype html><html lang="zh-Hant" data-doc="../docs/development/mastery-flow-demo.md?v=20260823-1628"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastery Flow Demo · Legacy Collector</title><link rel="stylesheet" href="../site.css?v=20260823-1628"><link rel="stylesheet" href="../systems/mastery-system.css?v=20260823-1628"></head><body><header class="topbar"><a class="brand" href="../index.html">LEGACY COLLECTOR</a><a href="../systems/mastery-system.html">返回熟練度系統</a></header><main class="shell"><div class="eyebrow">Development / Prototype</div><article class="doc" data-doc-content></article><section class="prototype mastery-demo"><div class="prototype-heading"><div><span class="prototype-kicker">Mastery Flow Test</span><h2>戰士熟練度流程測試</h2><p>這個 Demo 只驗證 Mastery 與職業戰績檔案的流程，不是正式職業卡。</p></div><span class="prototype-status progress">測試中</span></div><div class="mastery-demo-guide"><strong>測試方式</strong><span>按「完成任務」會立刻讓 Mastery X / 6 增加；六項完成後先顯示待戰後結算。按「戰鬥結算」才正式變成 MASTERED。完成後可繼續累積，驗證長期戰績可超過 Mastery 門檻。</span></div><article class="mastery-card sector-warrior is-confirmed"><div class="mastery-card-head"><div><div class="mastery-tier-label">Demo · 戰士</div><h3>職業戰績檔案 / Mastery</h3></div><span class="design-status confirmed">FLOW TEST</span></div><div class="mastery-test" data-demo></div></article></section></main><script src="../site.js?v=20260823-1628"></script><script>(()=>{const root=document.querySelector('[data-demo]');if(!root)return;const tasks=[{name:'使用戰士完成戰鬥',target:24,unit:'場'},{name:'使用戰士擊倒敵人',target:45,unit:'名'},{name:'參與擊敗 Elite / Boss',target:8,unit:'次'},{name:'承受敵方攻擊',target:60,unit:'次'},{name:'「堅守」生效期間受到敵方攻擊',target:30,unit:'次'},{name:'使用「猛擊」擊倒敵人',target:20,unit:'次'}];const values=tasks.map(()=>0);let mastered=false;const summary=document.createElement('div');summary.className='mastery-summary';const list=document.createElement('ol');list.className='checklist interactive';const controls=document.createElement('div');controls.className='mastery-test-controls';const death=document.createElement('button');death.type='button';death.textContent='模擬角色死亡';const settle=document.createElement('button');settle.type='button';settle.textContent='戰鬥結算';const reset=document.createElement('button');reset.type='button';reset.textContent='重設';const notice=document.createElement('div');notice.className='mastery-test-notice';controls.append(death,settle,reset);function draw(){list.innerHTML='';let complete=0;tasks.forEach((t,i)=>{const done=values[i]>=t.target;if(done)complete++;const li=document.createElement('li');li.className=done?'is-done':'';const text=document.createElement('div');text.className='checklist-text';text.innerHTML=`<span>${done?'✓ ':''}${t.name}</span><span class="kind">長期戰績：${values[i]} ${t.unit}</span>`;const prog=document.createElement('strong');prog.className='checklist-progress';prog.textContent=`${Math.min(values[i],t.target)} / ${t.target}`;const btn=document.createElement('button');btn.type='button';btn.textContent=done?'再累積 +10':'完成任務';btn.onclick=()=>{values[i]=done?values[i]+10:t.target;notice.textContent=done?'職業戰績持續增加；Mastery 已完成的門檻不會限制後台總數。':'此 Checklist 已立即達標，Mastery 計數同步增加。';draw()};li.append(text,prog,btn);list.appendChild(li)});if(mastered){summary.textContent='MASTERED';summary.classList.add('is-mastered')}else if(complete===tasks.length){summary.textContent=`Mastery ${complete} / ${tasks.length} · 待戰後結算`;summary.classList.remove('is-mastered')}else{summary.textContent=`Mastery ${complete} / ${tasks.length}`;summary.classList.remove('is-mastered')}}death.onclick=()=>{notice.textContent='角色死亡：已累積的職業戰績與已完成 Checklist 全部保留。';draw()};settle.onclick=()=>{const complete=tasks.filter((t,i)=>values[i]>=t.target).length;if(complete===tasks.length){mastered=true;notice.textContent='戰鬥結算：六項條件皆成立，正式取得 MASTERED。'}else{notice.textContent=`戰鬥結算：目前完成 ${complete} / ${tasks.length}，尚未取得 MASTERED。`}draw()};reset.onclick=()=>{values.fill(0);mastered=false;notice.textContent='Demo 已重設。';draw()};root.append(summary,list,controls,notice);draw()})();</script></body></html>
