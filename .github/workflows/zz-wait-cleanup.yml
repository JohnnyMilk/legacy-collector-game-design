name: Finalize helper cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-wait-cleanup.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sleep 5
          git pull --rebase origin main || true
          rm -f .tmp-noop .github/workflows/cleanup-noop.yml .github/workflows/retry-tier3-eight-class-restructure.yml .github/workflows/inspect-marker.yml .github/workflows/final-cleanup-temp.yml .github/workflows/zz-wait-cleanup.yml
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize temporary file cleanup"
            git push || (git pull --rebase origin main && git push)
          fi
