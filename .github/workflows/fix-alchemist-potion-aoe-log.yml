name: Fix alchemist potion AoE log
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-alchemist-potion-aoe-log.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch potion multi-target logging and cache versions
        shell: python
        run: |
          from pathlib import Path

          model = Path('development/combat-tests/combat-tier2-boss-model.js')
          text = model.read_text()
          old = """  usePotionLine(unit,skillId,dx,dy,startDistance,roll=Math.random){const s=this.skillById(unit,skillId);if(!s||s.kind!=='potion'||s.charges<=0||unit.acted||unit.usedActiveSkill)return{ok:false};const cells=this.potionLineCells(unit,dx,dy,startDistance);if(!cells.length)return{ok:false};const repeated=this.hasPassive(unit,'reformulation')&&unit.lastActiveSkillId===skillId,boost=repeated?1.3:1,pct=Math.round(20*boost),effects=['weak','corrode','slow'],pick=effects[Math.floor(roll()*effects.length)];s.charges--;unit.usedActiveSkill=true;unit.acted=true;unit.lastActiveSkillId=skillId;const targets=this.living('enemy').filter(e=>cells.some(c=>c.x===e.x&&c.y===e.y));for(const target of targets){target.tempDebuffCasterId=unit.id;if(pick==='weak')target.tempDamageDownPct=Math.max(target.tempDamageDownPct||0,pct);if(pick==='corrode'){target.tempDefDownPct=Math.max(target.tempDefDownPct||0,pct);target.tempMdefDownPct=Math.max(target.tempMdefDownPct||0,pct)}if(pick==='slow')target.tempAgiDownPct=Math.max(target.tempAgiDownPct||0,pct)}const effectText=pick==='weak'?'傷害':pick==='corrode'?'DEF/MDEF':'AGI';this.addLog(`${unit.label} 使用「${s.name}」：3 格直線／${targets.length} 名敵人 ${effectText} -${pct}%。`);return{ok:true,targets,cells,effect:pick,pct}}"""
          new = """  usePotionLine(unit,skillId,dx,dy,startDistance,roll=Math.random){
    const s=this.skillById(unit,skillId);
    if(!s||s.kind!=='potion'||s.charges<=0||unit.acted||unit.usedActiveSkill)return{ok:false};
    const cells=this.potionLineCells(unit,dx,dy,startDistance);
    if(!cells.length)return{ok:false};
    const repeated=this.hasPassive(unit,'reformulation')&&unit.lastActiveSkillId===skillId;
    const boost=repeated?1.3:1,pct=Math.round(20*boost),effects=['weak','corrode','slow'],pick=effects[Math.floor(roll()*effects.length)];
    s.charges--;unit.usedActiveSkill=true;unit.acted=true;unit.lastActiveSkillId=skillId;
    const targets=this.living('enemy').filter(e=>cells.some(c=>c.x===e.x&&c.y===e.y));
    const effectText=pick==='weak'?'傷害':pick==='corrode'?'DEF/MDEF':'AGI';
    for(const target of targets){
      target.tempDebuffCasterId=unit.id;
      if(pick==='weak')target.tempDamageDownPct=Math.max(target.tempDamageDownPct||0,pct);
      if(pick==='corrode'){
        target.tempDefDownPct=Math.max(target.tempDefDownPct||0,pct);
        target.tempMdefDownPct=Math.max(target.tempMdefDownPct||0,pct);
      }
      if(pick==='slow')target.tempAgiDownPct=Math.max(target.tempAgiDownPct||0,pct);
      this.addLog(`${target.label} 受到「${s.name}」：${effectText} -${pct}%。`);
    }
    if(targets.length){
      this.addLog(`${unit.label} 使用「${s.name}」：3 格直線共命中 ${targets.length} 名敵人（${targets.map(t=>t.label).join('、')}）。`);
    }else{
      this.addLog(`${unit.label} 使用「${s.name}」：3 格直線未命中敵人。`);
    }
    return{ok:true,targets,cells,effect:pick,pct};
  }"""
          if old not in text:
              raise SystemExit('Expected potion function not found')
          model.write_text(text.replace(old, new))

          app = Path('development/combat-tests/combat-tier2-boss-app.js')
          t = app.read_text().replace("./combat-tier2-boss-model.js?v=20260830-1550", "./combat-tier2-boss-model.js?v=20260906-1209")
          app.write_text(t)

          for name in ['demo-2-1.js','demo-2-2.js','boss-r1-mini-t2.js','boss-r1-final-t2.js']:
              p = Path('development/combat-tests')/name
              if p.exists():
                  t = p.read_text().replace("./combat-tier2-boss-app.js?v=20260830-1504", "./combat-tier2-boss-app.js?v=20260906-1209")
                  p.write_text(t)
      - name: Validate potion AoE logging
        shell: bash
        run: |
          grep -q "targets.map(t=>t.label).join('、')" development/combat-tests/combat-tier2-boss-model.js
          grep -q "受到.*藥劑" development/combat-tests/combat-tier2-boss-model.js || grep -q '受到「${s.name}」' development/combat-tests/combat-tier2-boss-model.js
          grep -q 'combat-tier2-boss-model.js?v=20260906-1209' development/combat-tests/combat-tier2-boss-app.js
          grep -q 'combat-tier2-boss-app.js?v=20260906-1209' development/combat-tests/demo-2-1.js
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-alchemist-potion-aoe-log.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix alchemist potion multi-target combat logging"
          git push