name: Apply damage tuning
on:
  push:
    paths:
      - '.github/workflows/tune-player-basic-tier1-damage.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tuning script
        run: python3 .github/scripts/tune_player_damage.py
      - name: Validate tuning
        run: |
          grep -q "normalAttackMultiplier(unit).*1.25" development/combat-tests/combat-model.js
          grep -q "multiplier:1.75" development/combat-tests/combat-class-runtime.js
          grep -q 'ATK ×1.75' data/classes.json
          grep -q 'MATK ×1.75' data/classes.json
          grep -q 'ATK \* 1.25 - DEF' data/class-stats.json
          grep -q '玩家物理普通攻擊.*1.25' docs/systems/damage-system.md
      - name: Remove migration files
        run: rm .github/workflows/tune-player-basic-tier1-damage.yml .github/scripts/tune_player_damage.py
      - name: Commit tuning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune player basic attacks and Tier 1 damage skills"
          git push