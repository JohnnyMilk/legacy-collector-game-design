name: Run Tier 3 v59 migration
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-tier3-v59-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync
        run: git pull --rebase origin main
      - name: Migrate
        run: python .github/scripts/restructure_tier3_v59.py
      - name: Commit
        run: |
          rm -f .github/workflows/run-tier3-v59-migration.yml
          rm -f .github/workflows/apply-tier3-eight-class-restructure-v2.yml
          rm -f .github/scripts/restructure_tier3_v59.py
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          git commit -m "Restructure Tier 3 into eight distinct classes"
          git push
