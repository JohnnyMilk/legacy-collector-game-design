name: Apply Rune Blade Magus design
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rune-blade-magus.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update class data and docs
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.')
          classes_path = root / 'data/classes.json'
          data = json.loads(classes_path.read_text(encoding='utf-8'))
          data['version'] = 57

          cid = 'tier3_rune_blade_magus'
          data['classDesigns'][cid] = {
              'status': 'confirmed',
              'exclusiveAbilityPattern': 'one-active-one-passive',
              'basicAttack': {
                  'name': '刻刃波',
                  'range': 2,
                  'damageType': 'magic',
                  'attackStyle': 'straight-line-ranged',
                  'effect': '選擇上下左右 1 個方向，攻擊前方直線連續 2 格；兩格若都有敵人則各受到 1 次魔法普通攻擊傷害。攻擊不會被其他單位截斷，但阻擋地形會截斷後方格。'
              },
              'passiveSkill': {
                  'name': '刻印共鳴',
                  'effect': '此職業使用「魔力刻印」時，刻印上限改為 1。當自身以魔法攻擊命中已帶有「魔力刻印」的敵人時，觸發「刻印溢散」：該敵人周圍 8 格內所有尚未帶有刻印的敵人獲得「魔力刻印」。溢散本身不造成傷害；由本次溢散新獲得的刻印不會在同一次攻擊中再次觸發連鎖溢散。'
              },
              'activeSkill': {
                  'name': '刻印崩解',
                  'maxCharges': 3,
                  'effect': '不需選擇目標或位置。施放後，全戰場所有帶有「魔力刻印」的敵人各自引爆，分別只對自己造成相當於施術者 2.0 倍魔法攻擊力的魔法傷害，不影響周圍其他單位；結算後移除所有被引爆敵人的「魔力刻印」。'
              },
              'masteryChecklist': [
                  {
                      'id': 'rune_blade_magus_mark_overflow_three',
                      'archiveMetric': 'rune-blade-magus-mark-overflow-three-new-enemies-events',
                      'category': 'passive-skill',
                      'description': '單次「刻印溢散」使至少 3 名原本沒有刻印的敵人獲得「魔力刻印」',
                      'target': 15,
                      'unit': '次'
                  },
                  {
                      'id': 'rune_blade_magus_mark_collapse_three',
                      'archiveMetric': 'rune-blade-magus-mark-collapse-three-enemies-events',
                      'category': 'active-skill',
                      'description': '單次使用「刻印崩解」同時引爆至少 3 名帶有刻印的敵人',
                      'target': 15,
                      'unit': '次'
                  }
              ]
          }

          for c in data['classes']:
              if c['id'] == cid:
                  c['name'] = '刻刃術師'
                  c['role'] = '刻印擴散／多目標鋪場／全場引爆'
                  c['trait'] = '以魔法攻擊讓刻印向敵群溢散，並透過刻印崩解一次引爆全場所有帶有刻印的敵人。'
                  c['conceptStatus'] = 'confirmed'
                  break

          classes_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gdd_path = root / 'docs/development/gdd-review.md'
          gdd = gdd_path.read_text(encoding='utf-8')
          old_state = 'Tier 3 外圈目前有 16 個概念節點；目前已完成正式設計：**軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士、空間魔導士**。戰士系 4 個 Tier 3 已全部完成；敏捷系 4 個 Tier 3 已全部完成；魔法系已有 1 個正式完成。其餘名稱與定位仍 provisional，必須依 Inspiration Links 的既有 Tier 2 技能包逐一重新設計。'
          new_state = 'Tier 3 外圈目前有 16 個概念節點；目前已完成正式設計：**軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士、空間魔導士、刻刃術師**。戰士系 4 個 Tier 3 已全部完成；敏捷系 4 個 Tier 3 已全部完成；魔法系已有 2 個正式完成。其餘名稱與定位仍 provisional，必須依 Inspiration Links 的既有 Tier 2 技能包逐一重新設計。'
          if old_state not in gdd:
              raise RuntimeError('Tier 3 current state marker not found')
          gdd = gdd.replace(old_state, new_state, 1)

          marker = '\n## Data / Report\n'
          section = '''\n### 已確認：刻刃術師\n\n- Tier 3 / 魔法系 / +67.5°。\n- Inspiration Links：舞刃者、魔劍士、巫師。\n- 定位：刻印擴散／多目標鋪場／全場引爆。\n- 一般攻擊「刻刃波」：選擇上下左右 1 個方向，攻擊前方直線 2 格；兩格若都有敵人則各受到魔法普通攻擊傷害。單位不會截斷攻擊，但阻擋地形會截斷後方格。\n- 被動「刻印共鳴」：此職業使用魔力刻印時上限改為 1。以魔法攻擊命中帶有魔力刻印的敵人時觸發「刻印溢散」，使該敵人周圍 8 格內尚未帶有刻印的敵人獲得魔力刻印。溢散不造成傷害，且本次新獲得的刻印不會在同一次攻擊中再次連鎖溢散。\n- 主動「刻印崩解」：3 Charge；不需選擇目標或位置。全戰場所有帶有魔力刻印的敵人各自引爆，只對自己造成相當於施術者 2.0 倍魔法攻擊力的魔法傷害，不影響周圍單位；結算後移除所有被引爆的魔力刻印。\n- Mastery：單次刻印溢散使至少 3 名原本沒有刻印的敵人獲得魔力刻印 **15 次**；單次刻印崩解同時引爆至少 3 名帶有刻印的敵人 **15 次**。\n'''
          if '### 已確認：刻刃術師' not in gdd:
              if marker not in gdd:
                  raise RuntimeError('Data / Report marker not found')
              gdd = gdd.replace(marker, section + marker, 1)
          gdd_path.write_text(gdd, encoding='utf-8')

          mastery = root / 'systems/mastery-system.html'
          s = mastery.read_text(encoding='utf-8')
          old = 'Tier 3 已載入 16 個概念節點；軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士與空間魔導士已完成正式設計。戰士系與敏捷系 Tier 3 已全部完成；魔法系已有 1 個正式完成。'
          new = 'Tier 3 已載入 16 個概念節點；軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士、空間魔導士與刻刃術師已完成正式設計。戰士系與敏捷系 Tier 3 已全部完成；魔法系已有 2 個正式完成。'
          if old not in s:
              raise RuntimeError('Mastery summary marker not found')
          stamp_old = '20260828-2135'
          stamp_new = '20260828-2235'
          s = s.replace(old, new, 1).replace(stamp_old, stamp_new)
          mastery.write_text(s, encoding='utf-8')

          class_page = root / 'systems/class-system.html'
          cs = class_page.read_text(encoding='utf-8').replace(stamp_old, stamp_new)
          class_page.write_text(cs, encoding='utf-8')

          review_page = root / 'development/gdd-review.html'
          if review_page.exists():
              rs = review_page.read_text(encoding='utf-8').replace('20260828-1510', stamp_new).replace(stamp_old, stamp_new)
              review_page.write_text(rs, encoding='utf-8')

          Path('.github/workflows/apply-rune-blade-magus.yml').unlink()
      - name: Commit
        run: |
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add data/classes.json docs/development/gdd-review.md systems/mastery-system.html systems/class-system.html development/gdd-review.html .github/workflows/apply-rune-blade-magus.yml
          git commit -m "Confirm Rune Blade Magus Tier 3 design"
          git push origin main