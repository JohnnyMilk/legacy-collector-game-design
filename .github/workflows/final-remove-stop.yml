name: Remove stop marker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-remove-stop.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f .github/workflows/STOP.yml .github/workflows/final-remove-stop.yml
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          git commit -m "Remove temporary stop marker"
          git push
