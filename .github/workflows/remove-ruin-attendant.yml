name: Remove obsolete Tier 1 ruin attendant
on:
  push:
    paths:
      - '.github/workflows/remove-ruin-attendant.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete unit and references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p=Path('data/enemy-stats.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['tiers']['tier1']['entries'].pop('ruin_attendant', None)
          data['version']=int(data.get('version',4))+1
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('docs/systems/enemy-stats.md')
          text=p.read_text(encoding='utf-8')
          text='\n'.join(line for line in text.split('\n') if '遺跡侍者' not in line)
          p.write_text(text,encoding='utf-8')

          # Remove any obsolete display/reference text elsewhere while preserving historical archives.
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or 'archive' in p.parts or p.suffix not in {'.md','.html','.js','.json'}: continue
            if p.as_posix() in {'data/enemy-stats.json','docs/systems/enemy-stats.md','.github/workflows/remove-ruin-attendant.yml'}: continue
            try: text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            if '遺跡侍者' in text:
              lines=[line for line in text.split('\n') if '遺跡侍者' not in line]
              p.write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Validate combat references
        run: |
          echo '=== ruin_attendant ID references ==='
          ! grep -RIn 'ruin_attendant' data docs development systems world --exclude-dir=archive || exit 1
          echo '=== 遺跡侍者 display references ==='
          ! grep -RIn '遺跡侍者' data docs development systems world --exclude-dir=archive || exit 1
          python3 -m json.tool data/enemy-stats.json >/dev/null
      - name: Remove migration workflow
        run: rm .github/workflows/remove-ruin-attendant.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove obsolete Tier 1 ruin attendant'
          git push origin main
