name: Apply Spatial Magister design
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-space-magister.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update class data and docs
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.')
          classes_path = root / 'data/classes.json'
          data = json.loads(classes_path.read_text(encoding='utf-8'))
          data['version'] = 56

          cid = 'tier3_phantom_blade_magister'
          data['classDesigns'][cid] = {
              'status': 'confirmed',
              'exclusiveAbilityPattern': 'two-actives-no-passive',
              'basicAttack': {
                  'name': '魔導劍',
                  'range': 3,
                  'damageType': 'magic',
                  'attackStyle': 'straight-line-ranged',
                  'effect': '選擇上下左右 1 個方向，攻擊前方直線 3 格；第 1 格造成 50% 魔法普通攻擊傷害、第 2 格造成 80%、第 3 格造成 100%。三格若都有敵人則可同時命中 3 名敵人；攻擊不會被單位或阻擋地形截斷。'
              },
              'activeSkills': [
                  {
                      'name': '界位交換',
                      'maxCharges': 3,
                      'effect': '指定 3 格內任意 1 個可合法交換位置的單位，立即與其交換位置。技能本身不造成傷害；若任一交換後位置對該單位屬於非法站位則不能施放。使用後本回合不得再進行普通攻擊或施放其他主動技能；若一般移動尚未使用，仍可依一般行動規則移動。'
                  },
                  {
                      'name': '魔導護盾',
                      'maxCharges': 3,
                      'effect': '不需選擇目標，按下後立即對自身施放並獲得 1 層防護罩。防護罩完全抵消下一個實際命中的單一傷害段，使該段傷害變為 0 後立即消失；若敵方攻擊包含多段傷害，只抵消第一個實際命中的傷害段，後續傷害正常結算。同時最多存在 1 層魔導護盾。'
                  }
              ],
              'masteryChecklist': [
                  {
                      'id': 'spatial_magister_position_exchange',
                      'archiveMetric': 'spatial-magister-position-exchange-events',
                      'category': 'active-skill',
                      'description': '使用「界位交換」成功與任意單位交換位置',
                      'target': 25,
                      'unit': '次'
                  },
                  {
                      'id': 'spatial_magister_lethal_shield_block',
                      'archiveMetric': 'spatial-magister-lethal-shield-block-events',
                      'category': 'active-skill',
                      'description': '使用「魔導護盾」成功抵消原本會使自身 HP 降至 0 或以下的致死傷害段',
                      'target': 15,
                      'unit': '次'
                  }
              ]
          }

          for c in data['classes']:
              if c['id'] == cid:
                  c['name'] = '空間魔導士'
                  c['role'] = '空間換位／直線魔法／自我防護'
                  c['trait'] = '以魔導劍穿透前方三格，並透過界位交換重構站位、魔導護盾抵消關鍵傷害。'
                  c['conceptStatus'] = 'confirmed'
                  break

          classes_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gdd_path = root / 'docs/development/gdd-review.md'
          gdd = gdd_path.read_text(encoding='utf-8')
          old_state = 'Tier 3 外圈目前有 16 個概念節點；目前已完成正式設計：**軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士**。戰士系 4 個 Tier 3 已全部完成；敏捷系已有 4 個正式完成。其餘名稱與定位仍 provisional，必須依 Inspiration Links 的既有 Tier 2 技能包逐一重新設計。'
          new_state = 'Tier 3 外圈目前有 16 個概念節點；目前已完成正式設計：**軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士、空間魔導士**。戰士系 4 個 Tier 3 已全部完成；敏捷系 4 個 Tier 3 已全部完成；魔法系已有 1 個正式完成。其餘名稱與定位仍 provisional，必須依 Inspiration Links 的既有 Tier 2 技能包逐一重新設計。'
          if old_state not in gdd:
              raise RuntimeError('Tier 3 current state marker not found')
          gdd = gdd.replace(old_state, new_state, 1)

          marker = '\n## Data / Report\n'
          section = '''\n### 已確認：空間魔導士\n\n- Tier 3 / 魔法系 / +45°。\n- Inspiration Links：刺客、舞刃者、魔劍士。\n- 定位：空間換位／直線魔法／自我防護。\n- 一般攻擊「魔導劍」：選擇上下左右 1 個方向，攻擊前方直線 3 格；第 1 格造成 50% 魔法普通攻擊傷害、第 2 格 80%、第 3 格 100%。三格可同時命中 3 名敵人，且不會被單位或阻擋地形截斷。\n- Tier 3 專屬能力採 **2 個主動技能、無專屬被動**；合法繼承技能仍完整保留。\n- 主動「界位交換」：3 Charge；指定 3 格內任意 1 個可合法交換位置的單位，立即與其交換位置。技能不造成傷害；若交換後任一位置非法則不能施放。使用後本回合不能再普通攻擊或施放其他主動技能；若一般移動尚未使用，仍可依一般規則移動。\n- 主動「魔導護盾」：3 Charge；不需選擇目標，立即對自身施放 1 層防護罩。護盾完全抵消下一個實際命中的單一傷害段後消失；多段攻擊只抵消第一個傷害段，後續照常結算；同時最多 1 層。\n- Mastery：使用界位交換成功與任意單位交換位置 **25 次**；使用魔導護盾成功抵消原本會使自身 HP 降至 0 或以下的致死傷害段 **15 次**。\n'''
          if '### 已確認：空間魔導士' not in gdd:
              if marker not in gdd:
                  raise RuntimeError('Data / Report marker not found')
              gdd = gdd.replace(marker, section + marker, 1)
          gdd = gdd.replace('- 逐一完成其餘 Tier 3。', '- 逐一完成其餘魔法系與支援系 Tier 3。', 1)
          gdd_path.write_text(gdd, encoding='utf-8')

          stamp = '20260828-2135'

          mastery_path = root / 'systems/mastery-system.html'
          mastery = mastery_path.read_text(encoding='utf-8')
          mastery = mastery.replace('20260828-1510', stamp)
          mastery = mastery.replace('Tier 3 已載入 16 個概念節點；軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師與影刃術士已完成正式設計。戰士系與敏捷系 Tier 3 已全部完成，接下來進入魔法系設計。', 'Tier 3 已載入 16 個概念節點；軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士與空間魔導士已完成正式設計。戰士系與敏捷系 Tier 3 已全部完成；魔法系已有 1 個正式完成。')
          old_decl = "const basic=d?.basicAttack,passives=Array.isArray(d?.passiveSkills)?d.passiveSkills:(d?.passiveSkill?[d.passiveSkill]:[]),active=d?.activeSkill,list=d?.masteryChecklist||[];"
          new_decl = "const basic=d?.basicAttack,passives=Array.isArray(d?.passiveSkills)?d.passiveSkills:(d?.passiveSkill?[d.passiveSkill]:[]),actives=Array.isArray(d?.activeSkills)?d.activeSkills:(d?.activeSkill?[d.activeSkill]:[]),list=d?.masteryChecklist||[];"
          if old_decl not in mastery:
              raise RuntimeError('Mastery active declaration marker not found')
          mastery = mastery.replace(old_decl, new_decl, 1)
          old_active = "const activeHtml=hasDesign&&active?`<strong>${esc(active.name||'—')}</strong><span>${esc(active.effect||'—')}</span><div class=\"mastery-meta\">Charge：${esc(active.maxCharges??'—')}</div>`:hasDesign&&d?.exclusiveAbilityPattern==='two-passives-no-active'?'<strong>無額外 Tier 3 專屬主動</strong><span>此職業以 2 個 Tier 3 專屬被動取代額外 Charge 3 主動；合法繼承主動技能仍照常保留。</span>':c.tier===3?'<strong>Tier 3 專屬能力待定義</strong><span>預設可採 Charge 3 主動，但個別職業允許其他專屬能力組合。</span>':'<strong>待定義</strong><span>主動技能名稱、效果與 Charge 尚未定義。</span>';"
          new_active = "const activeHtml=actives.length?actives.map(a=>`<div><strong>${esc(a.name||'—')}</strong><span>${esc(a.effect||'—')}</span><div class=\"mastery-meta\">Charge：${esc(a.maxCharges??'—')}</div></div>`).join(''):hasDesign&&d?.exclusiveAbilityPattern==='two-passives-no-active'?'<strong>無額外 Tier 3 專屬主動</strong><span>此職業以 2 個 Tier 3 專屬被動取代額外 Charge 3 主動；合法繼承主動技能仍照常保留。</span>':c.tier===3?'<strong>Tier 3 專屬能力待定義</strong><span>預設可採 Charge 3 主動，但個別職業允許其他專屬能力組合。</span>':'<strong>待定義</strong><span>主動技能名稱、效果與 Charge 尚未定義。</span>';"
          if old_active not in mastery:
              raise RuntimeError('Mastery active HTML marker not found')
          mastery = mastery.replace(old_active, new_active, 1)
          old_passive = "const passiveHtml=passives.length?passives.map(p=>`<div><strong>${esc(p.name||'—')}</strong><span>${esc(p.effect||'—')}</span></div>`).join(''):c.tier===3?'<strong>Tier 3 專屬被動待定義</strong><span>將依 Inspiration Links 的既有技能組合設計。</span>':'<strong>待定義</strong><span>被動技能名稱與效果尚未定義。</span>';"
          new_passive = "const passiveHtml=passives.length?passives.map(p=>`<div><strong>${esc(p.name||'—')}</strong><span>${esc(p.effect||'—')}</span></div>`).join(''):hasDesign&&d?.exclusiveAbilityPattern==='two-actives-no-passive'?'<strong>無額外 Tier 3 專屬被動</strong><span>此職業以 2 個 Tier 3 專屬主動技能構成專屬能力組合；合法繼承被動技能仍照常保留。</span>':c.tier===3?'<strong>Tier 3 專屬被動待定義</strong><span>將依 Inspiration Links 的既有技能組合設計。</span>':'<strong>待定義</strong><span>被動技能名稱與效果尚未定義。</span>';"
          if old_passive not in mastery:
              raise RuntimeError('Mastery passive HTML marker not found')
          mastery = mastery.replace(old_passive, new_passive, 1)
          mastery_path.write_text(mastery, encoding='utf-8')

          class_path = root / 'systems/class-system.html'
          class_html = class_path.read_text(encoding='utf-8').replace('20260828-1510', stamp)
          class_path.write_text(class_html, encoding='utf-8')

          gdd_html_path = root / 'development/gdd-review.html'
          gdd_html = gdd_html_path.read_text(encoding='utf-8').replace('20260828-1510', stamp)
          gdd_html_path.write_text(gdd_html, encoding='utf-8')

          # Remove this one-shot workflow so the repository stays clean.
          Path('.github/workflows/apply-space-magister.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add data/classes.json docs/development/gdd-review.md systems/mastery-system.html systems/class-system.html development/gdd-review.html .github/workflows/apply-space-magister.yml
          git commit -m "Confirm Spatial Magister Tier 3 design"
          git push origin main
