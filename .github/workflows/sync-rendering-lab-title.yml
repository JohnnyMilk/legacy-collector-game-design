name: Sync battle rendering lab title
on:
  push:
    paths:
      - '.github/workflows/sync-rendering-lab-title.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync rendering lab naming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          md=Path('docs/development/map-rendering-lab.md')
          text=md.read_text(encoding='utf-8')
          text=re.sub(r'^# .*$', '# 戰鬥地圖渲染研究', text, count=1, flags=re.M)
          # Keep the already-added Map / Dialogue / Integration structure, but make the scope explicit.
          if 'Map + Dialogue Integration' not in text and '地圖與角色對話' not in text:
              raise SystemExit('Dialogue/integration research content missing; refusing destructive rename')
          md.write_text(text, encoding='utf-8')

          html=Path('development/map-rendering-lab.html')
          text=html.read_text(encoding='utf-8')
          text=re.sub(r'<title>.*?</title>', '<title>Battlefield Rendering Lab · LEGACY COLLECTOR</title>', text, count=1)
          text=text.replace('Development / Map Rendering','Development / Battlefield + Dialogue Rendering')
          text=re.sub(r'(map-rendering-lab\.md\?v=)[^\"]+', r'\g<1>20260902-0718', text)
          html.write_text(text, encoding='utf-8')

          idx=Path('index.html')
          text=idx.read_text(encoding='utf-8')
          text=text.replace('>地圖渲染研究專區</a>', '>戰鬥地圖渲染研究</a>')
          text=text.replace('>地圖與角色對話渲染研究專區</a>', '>戰鬥地圖渲染研究</a>')
          idx.write_text(text, encoding='utf-8')
          PY
      - name: Validate structure and names
        run: |
          grep -q '^# 戰鬥地圖渲染研究$' docs/development/map-rendering-lab.md
          grep -q 'Dialogue Rendering' docs/development/map-rendering-lab.md
          grep -q 'Integration' docs/development/map-rendering-lab.md
          grep -q '>戰鬥地圖渲染研究</a>' index.html
          ! grep -RIn '地圖渲染研究專區\|地圖與角色對話渲染研究專區' index.html docs/development/map-rendering-lab.md development/map-rendering-lab.html
      - name: Remove migration workflow
        run: rm .github/workflows/sync-rendering-lab-title.yml
      - name: Commit synchronized rendering research page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rename battle rendering lab and preserve dialogue research'
          git push origin main
