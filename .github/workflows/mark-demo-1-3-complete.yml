name: One-time Demo 1-3 completion sync
on:
  push:
    paths:
      - '.github/workflows/mark-demo-1-3-complete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Combat Test index
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('development/combat-test-index.html')
          s=p.read_text()
          s=s.replace('class="status-progress" href="combat-tests/demo-1-3.html"','class="status-confirmed" href="combat-tests/demo-1-3.html"')
          s=s.replace('測試中。地圖、敵方 Tier 1 ×4 + Tier 2 ×4 與隨機 4 格障礙完全沿用 Demo 1-2；玩家每次載入隨機抽 2 個不同 Tier 1 職業與 2 個不同 Tier 2 職業，再隨機分配給四名主角。','完成。地圖、敵方 Tier 1 ×4 + Tier 2 ×4 與隨機 4 格障礙完全沿用 Demo 1-2；玩家每次載入隨機抽 2 個不同 Tier 1 職業與 2 個不同 Tier 2 職業。實測可獲勝，但勝率偏低，代表一半隊伍完成 Tier 2 轉職已具備通關可能，仍屬高風險配置。')
          s=s.replace('<strong>2×Tier 1 + 2×Tier 2：</strong>Demo 1-3 待驗證。','<strong>2×Tier 1 + 2×Tier 2：</strong>Demo 1-3 已驗證可以獲勝，但勝率偏低；屬於已跨過通關門檻、仍具高失敗風險的過渡隊伍。')
          p.write_text(s)

          p=Path('docs/development/combat-test-index.md')
          s=p.read_text()
          s=s.replace('### Demo 1-3｜Region 1 後段：2 名 Tier 1 + 2 名 Tier 2 玩家｜測試中','### Demo 1-3｜Region 1 後段：2 名 Tier 1 + 2 名 Tier 2 玩家｜完成')
          s=s.replace('- 目的：驗證 Region 1 後段若玩家只有一半隊伍完成 Tier 2 轉職，是否已具備合理通關可能。','- 目的：驗證 Region 1 後段若玩家只有一半隊伍完成 Tier 2 轉職，是否已具備合理通關可能。\n- 結果：可以獲勝，但勝率偏低。\n- 結論：2 名 Tier 1 + 2 名 Tier 2 已跨過「無法通關」門檻，但仍屬高風險過渡隊伍；實際勝負會明顯受抽到的 Tier 2 職業、敵方 Tier 2 組合與操作影響。')
          s=s.replace('- **2×Tier 1 + 2×Tier 2 玩家 → Region 1 後段混編：Demo 1-3 待驗證。**','- **2×Tier 1 + 2×Tier 2 玩家 → Region 1 後段混編：可以獲勝，但勝率偏低，屬高風險通關。**')
          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/mark-demo-1-3-complete.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add development/combat-test-index.html docs/development/combat-test-index.md .github/workflows/mark-demo-1-3-complete.yml
          git commit -m 'Mark Demo 1-3 complete and record low-win-rate result'
          git push
