name: Cleanup one more
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-one-more.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f .github/workflows/cleanup-one-more.yml .github/workflows/cleanup-latest-temp.yml
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          git commit -m "Remove last temporary helper" || true
          git push || true
