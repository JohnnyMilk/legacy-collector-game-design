name: Run shared floating migration
on: [push]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 development/_migrate_shared_floating_and_demo22.py
      - run: |
          grep -q "installFloatingCombatText(this)" development/combat-tests/combat-app.js
          grep -q "combat-floating-text.css?v=20260906-1838" development/combat-tests/combat-ui.css
          grep -q "Demo 2-2｜Region 2：Tier 2 ×12 極限測試｜完成" docs/development/combat-test-index.md
          grep -q "status-confirmed.*Demo 2-2｜Region 2：Tier 2 ×12 極限測試" development/combat-test-index.html
      - run: rm development/_migrate_shared_floating_and_demo22.py .github/workflows/run-shared-floating-migration.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Share floating combat text and complete Demo 2-2"
          git push