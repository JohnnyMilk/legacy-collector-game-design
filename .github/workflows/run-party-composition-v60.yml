name: Run party composition v60
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-party-composition-v60.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run migration
        run: python .github/scripts/update_party_composition_v60.py
      - name: Commit changes
        run: |
          rm -f .github/scripts/update_party_composition_v60.py
          rm -f .github/workflows/run-party-composition-v60.yml
          rm -f .github/workflows/update-party-composition-v60.yml
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          git commit -m "Confirm party composition count bonuses"
          git push
