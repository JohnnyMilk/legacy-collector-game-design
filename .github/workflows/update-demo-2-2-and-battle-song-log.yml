name: Update Demo 2-2 and battle song log
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-demo-2-2-and-battle-song-log.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply combat updates
        shell: python
        run: |
          from pathlib import Path
          import json

          # 1) Demo 2-2 scenario: 8 -> 12 Tier 2 enemies.
          p = Path('development/combat-tests/scenarios/demo-2-2.json')
          data = json.loads(p.read_text())
          data['enemies'] = [
              {"id":"enemy-t2-01","enemyTier":"tier2","x":0,"y":0},
              {"id":"enemy-t2-02","enemyTier":"tier2","x":2,"y":0},
              {"id":"enemy-t2-03","enemyTier":"tier2","x":5,"y":0},
              {"id":"enemy-t2-04","enemyTier":"tier2","x":7,"y":0},
              {"id":"enemy-t2-05","enemyTier":"tier2","x":1,"y":1},
              {"id":"enemy-t2-06","enemyTier":"tier2","x":3,"y":1},
              {"id":"enemy-t2-07","enemyTier":"tier2","x":4,"y":1},
              {"id":"enemy-t2-08","enemyTier":"tier2","x":6,"y":1},
              {"id":"enemy-t2-09","enemyTier":"tier2","x":0,"y":2},
              {"id":"enemy-t2-10","enemyTier":"tier2","x":2,"y":2},
              {"id":"enemy-t2-11","enemyTier":"tier2","x":5,"y":2},
              {"id":"enemy-t2-12","enemyTier":"tier2","x":7,"y":2}
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # 2) Demo runtime text/count: 8 -> 12.
          p = Path('development/combat-tests/demo-2-2.js')
          t = p.read_text()
          t = t.replace('randomTier2Enemies(enemyStats,8)', 'randomTier2Enemies(enemyStats,12)')
          t = t.replace("['8 名 Tier 2 敵方全滅。',party,'本場用於測試 4 名 Tier 2 玩家面對兩倍同 Tier 敵軍時的實際承壓極限。']", "['12 名 Tier 2 敵方全滅。',party,'本場用於測試 4 名 Tier 2 玩家面對三倍數量同 Tier 敵軍時的實際承壓極限。']")
          t = t.replace("./combat-tier2-boss-app.js?v=20260906-1209", "./combat-tier2-boss-app.js?v=20260906-1234")
          p.write_text(t)

          # 3) Battle Song: log every ally that actually receives the buff, plus summary.
          p = Path('development/combat-tests/combat-tier2-boss-model.js')
          t = p.read_text()
          old = "if(s.kind==='battle-song'){const allies=this.living('player').filter(a=>a.id!==unit.id&&Math.max(Math.abs(a.x-unit.x),Math.abs(a.y-unit.y))===1);allies.forEach(a=>a.battleSongBuff=true);this.addLog(`${unit.label} 使用「${s.name}」：${allies.length} 名友方下一次行動傷害 +20%。`);return{ok:true}}"
          new = "if(s.kind==='battle-song'){const allies=this.living('player').filter(a=>a.id!==unit.id&&Math.max(Math.abs(a.x-unit.x),Math.abs(a.y-unit.y))===1);for(const ally of allies){ally.battleSongBuff=true;this.addLog(`${ally.label} 獲得「${s.name}」：下一次行動傷害 +20%。`)}if(allies.length)this.addLog(`${unit.label} 使用「${s.name}」：共強化 ${allies.length} 名友方（${allies.map(a=>a.label).join('、')}）。`);else this.addLog(`${unit.label} 使用「${s.name}」：周圍沒有可獲得效果的友方。`);return{ok:true}}"
          if old not in t:
              raise SystemExit('battle-song block not found')
          p.write_text(t.replace(old, new))

          # 4) Bust model cache in shared Tier2 app.
          p = Path('development/combat-tests/combat-tier2-boss-app.js')
          t = p.read_text().replace("./combat-tier2-boss-model.js?v=20260906-1209", "./combat-tier2-boss-model.js?v=20260906-1234")
          p.write_text(t)

          # 5) Combat Test Index MD + HTML: 8 -> 12 and two-times -> three-times.
          p = Path('docs/development/combat-test-index.md')
          t = p.read_text()
          t = t.replace('### Demo 2-2｜Region 2：Tier 2 ×8 極限測試｜測試中', '### Demo 2-2｜Region 2：Tier 2 ×12 極限測試｜測試中')
          t = t.replace('- 敵人：每次載入隨機 Tier 2 ×8。', '- 敵人：每次載入隨機 Tier 2 ×12。')
          t = t.replace('兩倍數量同 Tier 敵軍', '三倍數量同 Tier 敵軍')
          p.write_text(t)

          p = Path('development/combat-test-index.html')
          t = p.read_text()
          t = t.replace('Demo 2-2｜Region 2：Tier 2 ×8 極限測試', 'Demo 2-2｜Region 2：Tier 2 ×12 極限測試')
          t = t.replace('隨機 Tier 2 ×8', '隨機 Tier 2 ×12')
          t = t.replace('兩倍數量同 Tier 敵軍', '三倍數量同 Tier 敵軍')
          p.write_text(t)

      - name: Validate changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('development/combat-tests/scenarios/demo-2-2.json'))
          assert len(d['enemies']) == 12
          assert all(e['enemyTier']=='tier2' for e in d['enemies'])
          PY
          grep -q 'randomTier2Enemies(enemyStats,12)' development/combat-tests/demo-2-2.js
          grep -q '獲得「${s.name}」：下一次行動傷害 +20%' development/combat-tests/combat-tier2-boss-model.js
          grep -q "allies.map(a=>a.label).join('、')" development/combat-tests/combat-tier2-boss-model.js
          grep -q 'Tier 2 ×12 極限測試' docs/development/combat-test-index.md
          grep -q 'Tier 2 ×12 極限測試' development/combat-test-index.html
      - name: Remove one-time workflow
        run: rm .github/workflows/update-demo-2-2-and-battle-song-log.yml
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increase Demo 2-2 to 12 enemies and improve battle song logging"
          git push