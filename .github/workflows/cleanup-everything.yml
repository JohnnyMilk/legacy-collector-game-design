name: Cleanup all temp workflows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-everything.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sleep 10
          git pull --rebase origin main || true
          rm -f .tmp-noop
          rm -f .github/workflows/apply-tier3-eight-class-restructure.yml
          rm -f .github/workflows/cleanup-noop.yml
          rm -f .github/workflows/retry-tier3-eight-class-restructure.yml
          rm -f .github/workflows/inspect-marker.yml
          rm -f .github/workflows/final-cleanup-temp.yml
          rm -f .github/workflows/zz-wait-cleanup.yml
          rm -f .github/workflows/STOP.yml
          rm -f .github/workflows/final-remove-stop.yml
          rm -f .github/workflows/cleanup-everything.yml
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Clean all temporary workflow helpers"
            git push || (git pull --rebase origin main && git push)
          fi
