name: Remove temporary helper files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-cleanup-temp.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git pull --rebase origin main
          rm -f .tmp-noop .github/workflows/cleanup-noop.yml .github/workflows/retry-tier3-eight-class-restructure.yml .github/workflows/inspect-marker.yml .github/workflows/final-cleanup-temp.yml
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Clean temporary helper files"
            git push
          fi
