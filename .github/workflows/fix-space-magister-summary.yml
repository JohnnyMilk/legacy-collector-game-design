name: Fix Spatial Magister mastery summary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-space-magister-summary.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix summary
        shell: python
        run: |
          from pathlib import Path
          p = Path('systems/mastery-system.html')
          s = p.read_text(encoding='utf-8')
          old = 'Tier 3 已載入 16 個概念節點；軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師與影刃術士已完成正式設計。戰士系 Tier 3 已全部完成，敏捷系目前已有 4 個正式完成。'
          new = 'Tier 3 已載入 16 個概念節點；軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士與空間魔導士已完成正式設計。戰士系與敏捷系 Tier 3 已全部完成；魔法系已有 1 個正式完成。'
          if old not in s:
              raise RuntimeError('summary marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-space-magister-summary.yml').unlink()
      - name: Commit
        run: |
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add systems/mastery-system.html .github/workflows/fix-space-magister-summary.yml
          git commit -m "Refresh Mastery summary for Spatial Magister"
          git push origin main
