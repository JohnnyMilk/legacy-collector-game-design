name: Clean accidental noop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-noop.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          rm -f .tmp-noop .github/workflows/cleanup-noop.yml
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          git commit -m "Remove temporary verification files"
          git push
