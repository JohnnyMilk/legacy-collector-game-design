name: Sync enemy display names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-enemy-display-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename enemy and boss display names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          skip_roots = {Path('archive'), Path('docs/archive')}
          text_exts = {'.json', '.md', '.html', '.js'}

          unique = {
              '遺跡衛士': '刻印衛士',
              '遺跡獵手': '尋跡者',
              '秘儀執行者': '奧術執行體',
              '遺跡修復師': '修復使',
              '守門構裝體': '重裝構裝體',
              '遺跡追獵者': '逐跡獵王',
              '遺跡守門者': '封門巨像',
          }
          generic = {
              '獵兵': '荒路獵手',
              '劍兵': '斷刃兵',
              '術士': '灰燼術士',
              '重衛': '石鎧衛',
          }

          def skipped(path):
              return any(path == s or s in path.parents for s in skip_roots) or path.as_posix().startswith('.git/')

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in text_exts or skipped(path):
                  continue
              if path.as_posix() == '.github/workflows/sync-enemy-display-names.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in unique.items():
                  new = new.replace(old, repl)
              for old, repl in generic.items():
                  # Only standalone Chinese-name tokens. This deliberately avoids names such as 咒術師.
                  new = re.sub(rf'(?<![\u3400-\u9fff]){re.escape(old)}(?![\u3400-\u9fff])', repl, new)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.as_posix())

          # Explicitly advance formal data versions.
          for p, version in [(Path('data/enemy-stats.json'), 4), (Path('data/boss-stats.json'), 7)]:
              data = json.loads(p.read_text(encoding='utf-8'))
              data['version'] = version
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              if p.as_posix() not in changed:
                  changed.append(p.as_posix())

          # Force fresh formal-data loads in all combat demos without changing encounter IDs or parameters.
          stamp = '20260830-2102'
          for path in Path('development/combat-tests').glob('*.js'):
              text = path.read_text(encoding='utf-8')
              new = re.sub(r"(\.\./\.\./data/enemy-stats\.json)(?:\?v=[^'\"]+)?", rf"\1?v={stamp}", text)
              new = re.sub(r"(\.\./\.\./data/boss-stats\.json)(?:\?v=[^'\"]+)?", rf"\1?v={stamp}", new)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  if path.as_posix() not in changed:
                      changed.append(path.as_posix())

          # Force fresh Markdown on the Enemy Stats HTML reading page.
          p = Path('systems/enemy-stats.html')
          text = p.read_text(encoding='utf-8')
          new = re.sub(r'20260830-\d{4}', stamp, text)
          if new != text:
              p.write_text(new, encoding='utf-8')
              if p.as_posix() not in changed:
                  changed.append(p.as_posix())

          print('Changed files:')
          for p in sorted(changed): print(' -', p)
          PY

      - name: Remove migration workflow
        run: rm .github/workflows/sync-enemy-display-names.yml

      - name: Conflict scan
        run: |
          echo '=== Remaining approved old display names outside archive ==='
          if grep -RInE '遺跡衛士|遺跡獵手|秘儀執行者|遺跡修復師|守門構裝體|遺跡追獵者|遺跡守門者' . \
            --exclude-dir=.git --exclude-dir=archive --exclude-dir=docs/archive; then
            echo 'CONFLICT_OLD_UNIQUE=1' >> "$GITHUB_ENV"
          else
            echo 'CONFLICT_OLD_UNIQUE=0' >> "$GITHUB_ENV"
          fi
          echo '=== Generic old names as standalone tokens outside archive ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=['獵兵','劍兵','術士','重衛']
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'archive' in p.parts: continue
              if p.suffix not in {'.json','.md','.html','.js'}: continue
              try: text=p.read_text(encoding='utf-8')
              except: continue
              for n in names:
                  if re.search(rf'(?<![\u3400-\u9fff]){re.escape(n)}(?![\u3400-\u9fff])', text):
                      hits.append((p.as_posix(),n))
          for h in hits: print(h[0], h[1])
          print('GENERIC_HITS',len(hits))
          PY
          echo '=== Existing uncovered Region 1 enemy name ==='
          grep -RIn '遺跡侍者' data docs development systems world --exclude-dir=archive || true

      - name: Commit synchronized names
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync Region 1 enemy and boss display names'
          git push origin main
