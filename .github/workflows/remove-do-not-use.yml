name: Remove do-not-use marker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-do-not-use.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f .github/workflows/do-not-use.yml .github/workflows/remove-do-not-use.yml
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          git commit -m "Remove temporary marker"
          git push
