name: Apply Binding Mage design
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-binding-mage.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update class data and docs
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('.')
          classes_path = root / 'data/classes.json'
          data = json.loads(classes_path.read_text(encoding='utf-8'))
          data['version'] = 58
          cid = 'tier3_hexmark_magister'
          data['classDesigns'][cid] = {
              'status':'confirmed',
              'exclusiveAbilityPattern':'one-active-one-passive',
              'basicAttack':{
                  'name':'咒縛','range':2,'damageType':'magic','attackStyle':'ranged',
                  'effect':'對 2 格內單一敵人進行魔法普通攻擊；命中後使該敵人的攻擊力與防禦各 -25%，持續至咒縛師下一次自身行動開始。'
              },
              'passiveSkill':{
                  'name':'禁行咒',
                  'effect':'對目前處於無法移動狀態的敵人造成傷害時，該次傷害 +30%。不限定無法移動狀態的來源，因此可與繼承的「束縛咒」或「地脈逆行」配合。不同來源的 Debuff 可同時存在；同名效果不重複疊加。'
              },
              'activeSkill':{
                  'name':'地脈逆行','maxCharges':3,
                  'effect':'選擇上下左右 1 個方向，對前方直線最遠 8 格範圍內的所有敵人施加無法移動狀態，持續至咒縛師下一次自身行動開始；受影響敵人仍可原地執行合法行動。'
              },
              'masteryChecklist':[
                  {'id':'binding_mage_earthflow_three','archiveMetric':'binding-mage-earthflow-three-enemies-events','category':'active-skill','description':'單次「地脈逆行」使至少 3 名敵人進入無法移動狀態','target':15,'unit':'次'},
                  {'id':'binding_mage_immobile_bonus_damage','archiveMetric':'binding-mage-immobile-bonus-damage-events','category':'passive-skill','description':'對目前無法移動的敵人觸發「禁行咒」+30% 傷害並成功造成傷害','target':20,'unit':'次'}
              ]
          }
          for c in data['classes']:
              if c['id']==cid:
                  c['name']='咒縛師'
                  c['role']='弱化／直線禁足／禁足增傷'
                  c['trait']='以咒縛削弱敵方攻防，透過地脈逆行封鎖長直線敵人移動，再以禁行咒放大對受控目標的傷害。'
                  c['conceptStatus']='confirmed'
                  break
          classes_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          gdd_path=root/'docs/development/gdd-review.md'
          gdd=gdd_path.read_text(encoding='utf-8')
          old='Tier 3 外圈目前有 16 個概念節點；目前已完成正式設計：**軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士、空間魔導士、刻刃術師**。戰士系 4 個 Tier 3 已全部完成；敏捷系 4 個 Tier 3 已全部完成；魔法系已有 2 個正式完成。其餘名稱與定位仍 provisional，必須依 Inspiration Links 的既有 Tier 2 技能包逐一重新設計。'
          new='Tier 3 外圈目前有 16 個概念節點；目前已完成正式設計：**軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士、空間魔導士、刻刃術師、咒縛師**。戰士系 4 個 Tier 3 已全部完成；敏捷系 4 個 Tier 3 已全部完成；魔法系已有 3 個正式完成。其餘名稱與定位仍 provisional，必須依 Inspiration Links 的既有 Tier 2 技能包逐一重新設計。'
          if old not in gdd: raise RuntimeError('state marker not found')
          gdd=gdd.replace(old,new,1)
          section='''\n### 已確認：咒縛師\n\n- Tier 3 / 魔法系 / +90°。\n- Inspiration Links：魔劍士、巫師、咒術師。\n- 定位：弱化／直線禁足／禁足增傷。\n- 一般攻擊「咒縛」：2 格魔法普通攻擊；命中後使敵人攻擊力與防禦各 -25%，持續至咒縛師下一次自身行動開始。\n- 主動「地脈逆行」：3 Charge；選擇上下左右 1 個方向，使前方直線最遠 8 格範圍內所有敵人無法移動，持續至咒縛師下一次自身行動開始；敵人仍可原地執行合法行動。\n- 被動「禁行咒」：對目前無法移動的敵人造成傷害時，該次傷害 +30%；不限定禁足來源，因此可與束縛咒或地脈逆行配合。不同來源 Debuff 可同時存在，同名效果不重複疊加。\n- Mastery：單次地脈逆行使至少 3 名敵人進入無法移動狀態 **15 次**；對無法移動的敵人觸發禁行咒 +30% 傷害並成功造成傷害 **20 次**。\n'''
          marker='\n## Data / Report\n'
          if '### 已確認：咒縛師' not in gdd:
              if marker not in gdd: raise RuntimeError('data marker not found')
              gdd=gdd.replace(marker,section+marker,1)
          gdd_path.write_text(gdd,encoding='utf-8')

          mastery_path=root/'systems/mastery-system.html'
          mastery=mastery_path.read_text(encoding='utf-8')
          old_summary='Tier 3 已載入 16 個概念節點；軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士、空間魔導士與刻刃術師已完成正式設計。戰士系與敏捷系 Tier 3 已全部完成；魔法系已有 2 個正式完成。'
          new_summary='Tier 3 已載入 16 個概念節點；軍團守衛、血煉騎士、戰將、獵刃武者、斷罪士、夜獵手、幻行師、影刃術士、空間魔導士、刻刃術師與咒縛師已完成正式設計。戰士系與敏捷系 Tier 3 已全部完成；魔法系已有 3 個正式完成。'
          if old_summary in mastery:
              mastery=mastery.replace(old_summary,new_summary,1)
          mastery_path.write_text(mastery,encoding='utf-8')
          Path('.github/workflows/apply-binding-mage.yml').unlink()
      - name: Commit
        run: |
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add data/classes.json docs/development/gdd-review.md systems/mastery-system.html .github/workflows/apply-binding-mage.yml
          git commit -m "Confirm Binding Mage Tier 3 design"
          git push origin main
