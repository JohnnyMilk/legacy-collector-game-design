name: Apply eight-class Tier 3 restructure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tier3-eight-class-restructure.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restructure Tier 3 and synchronize site
        shell: python
        run: |
          import json, re
          from pathlib import Path
          root=Path('.')
          stamp='20260829-0805'
          classes_path=root/'data/classes.json'
          old_text=classes_path.read_text(encoding='utf-8')
          old=json.loads(old_text)

          # Archive the complete pre-restructure data snapshot before any mutation.
          (root/'archive').mkdir(exist_ok=True)
          (root/'docs/archive').mkdir(parents=True,exist_ok=True)
          (root/'archive/tier3-16-class-version.json').write_text(old_text,encoding='utf-8')
          archive_md='''# Tier 3 16 職業配置｜舊版 / 已取消\n\n> ARCHIVED / CANCELLED：此頁保留 2026-08-28 的 Tier 3 16 節點版本，只作歷史參考，不得覆蓋現行 8 職業規格。\n\n舊版 Tier 3 使用 22.5° 間距，共 16 個外圈節點。後續設計發現職業數量過多、部分定位重疊，因此改為 8 個高辨識度 Tier 3：4 個單系核心 + 4 個跨系職業。\n\n舊版完整資料快照：`archive/tier3-16-class-version.json`。\n\n## 舊版 16 個 Tier 3\n\n- 戰地調律師\n- 軍團守衛\n- 血煉騎士\n- 戰將\n- 獵刃武者\n- 斷罪士\n- 夜獵手\n- 幻行師\n- 影刃術士\n- 空間魔導士\n- 刻刃術師\n- 咒縛師\n- 聖咒術師\n- 戰場賢者\n- 聖歌咒師\n- 調律賢者\n\n## 取消原因\n\n現行 Tier 3 改為每 45° 一個節點，保留真正具有獨立職業幻想與玩法核心的職業。被取消的職業與技能設計仍保留在 JSON 快照供未來擴充參考，但不屬於現行職業樹。\n'''
          (root/'docs/archive/tier3-16-class-version.md').write_text(archive_md,encoding='utf-8')

          data=old
          data['version']=59
          data['tier3StructureRule']={
            'totalClasses':8,
            'angleStep':45,
            'singleSectorCoreCount':4,
            'dualSectorBoundaryCount':4,
            'dualSectorCountsForAllListedSectors':True,
            'partySectorCountMinimum':4,
            'partySectorCountMaximum':8,
            'description':'Tier 3 由 4 個單系核心職業與 4 個跨系職業構成；跨系職業同時屬於兩個職業系，隊伍職業系計數時兩系都各計 1。'
          }

          keep_ids=['tier3_warfront_guardian','tier3_bloodforged_knight','tier3_headhunter','tier3_swift_shadow','tier3_shadowblade_occultist','tier3_phantom_blade_magister','tier3_hexmark_magister']
          obsolete=[c['id'] for c in data['classes'] if c.get('tier')==3 and c['id'] not in keep_ids]
          for cid in obsolete:
            data.get('classDesigns',{}).pop(cid,None)
            data.get('tier3InspirationLinks',{}).pop(cid,None)
          data['classes']=[c for c in data['classes'] if c.get('tier')!=3 or c['id'] in keep_ids]

          configs={
            'tier3_warfront_guardian':(-135,['support','warrior'],'支援 × 戰士','前線戰術核心／區域封鎖／隊伍保護',['tier2_cleric','tier2_bard','tier2_alchemist','tier2_knight']),
            'tier3_bloodforged_knight':(-90,['warrior'],'戰士','前線承傷轉化／低血爆發／生命資源運用',['tier2_knight','tier2_berserker','tier2_samurai']),
            'tier3_headhunter':(-45,['warrior','agile'],'戰士 × 敏捷','高風險追殺／單體處決',['tier2_berserker','tier2_samurai','tier2_ranger','tier2_assassin']),
            'tier3_swift_shadow':(0,['agile'],'敏捷','距離蓄勢／全圖傳送／分身擾敵',['tier2_ranger','tier2_assassin','tier2_blade_dancer']),
            'tier3_shadowblade_occultist':(45,['agile','magic'],'敏捷 × 魔法','物魔交替／機動連段／連鎖爆發',['tier2_assassin','tier2_blade_dancer','tier2_spellblade','tier2_wizard']),
            'tier3_phantom_blade_magister':(90,['magic'],'魔法','空間換位／直線魔法／自我防護',['tier2_spellblade','tier2_wizard','tier2_occultist']),
            'tier3_hexmark_magister':(135,['magic','support'],'魔法 × 支援','弱化／直線禁足／禁足增傷',['tier2_wizard','tier2_occultist','tier2_cleric','tier2_bard']),
          }
          for c in data['classes']:
            if c['id'] in configs:
              angle,sectors,label,role,links=configs[c['id']]
              c['angle']=angle;c['sectors']=sectors;c['sector']=sectors[-1] if len(sectors)>1 else sectors[0]
              c['sectorLabel']=label;c['role']=role;c['hidden']=False;c['conceptStatus']='confirmed'
              data['tier3InspirationLinks'][c['id']]=links
            elif c.get('tier') in (1,2):
              c['sectors']=[c['sector']]

          sacred_id='tier3_sacred_arbiter'
          data['classes'].append({
            'id':sacred_id,'name':'聖律師','tier':3,'sector':'support','sectors':['support'],'sectorLabel':'支援','angle':180,
            'role':'生命維持／全體淨化／自我復甦','trait':'以近戰聖療維持隊友生命、以聖域重整清除全隊負面狀態，並以不滅聖契在死亡時自我復甦。',
            'hidden':False,'conceptStatus':'confirmed'
          })
          data['tier3InspirationLinks'][sacred_id]=['tier2_cleric','tier2_bard','tier2_alchemist']
          data['classDesigns'][sacred_id]={
            'status':'confirmed','exclusiveAbilityPattern':'one-active-one-passive',
            'basicAttack':{'name':'聖療','range':1,'damageType':'healing','attackStyle':'melee-support','effect':'指定相鄰 1 格的友方單位（不可指定自己）作為一般攻擊目標；不造成傷害，改為恢復等同於該次一般攻擊原應造成數值的 HP。'},
            'activeSkill':{'name':'聖域重整','maxCharges':3,'effect':'不需指定單一目標；立即解除所有存活我方單位（包含自身）身上的所有負面狀態。不額外治療，也不提供攻擊或防禦增益。'},
            'passiveSkill':{'name':'不滅聖契','effect':'自身死亡時立即觸發，改以最大 HP 的 25% 復活；每場戰鬥最多觸發 1 次。死亡與 Party Wipe 判定必須在此類復活效果結算後才進行。'},
            'masteryChecklist':[
              {'id':'sacred_arbiter_cleanse_three_allies','archiveMetric':'sacred-arbiter-cleanse-three-allies-events','category':'active-skill','description':'單次使用「聖域重整」解除至少 3 個友方單位身上的負面狀態','target':15,'unit':'次'},
              {'id':'sacred_arbiter_revival','archiveMetric':'sacred-arbiter-revival-events','category':'passive-skill','description':'觸發「不滅聖契」並以最大 HP 25% 復活','target':10,'unit':'次'}
            ]
          }

          # Explicit memory requirements: core class plus both adjacent dual-sector classes.
          memory_requirements={
            'warrior':['tier3_warfront_guardian','tier3_bloodforged_knight','tier3_headhunter'],
            'agile':['tier3_headhunter','tier3_swift_shadow','tier3_shadowblade_occultist'],
            'magic':['tier3_shadowblade_occultist','tier3_phantom_blade_magister','tier3_hexmark_magister'],
            'support':['tier3_hexmark_magister',sacred_id,'tier3_warfront_guardian']
          }
          for m in data.get('memoryForms',[]):
            m['requiredTier3Ids']=memory_requirements[m['sector']]
            m['requireAllSectorTier3Masteries']=True
          data['memoryAwakeningRule']['sectorTier3RequirementIncludesDualSectorClasses']=True
          data['memoryAwakeningRule']['description']='四名主角各自擁有唯一的「XXX 的記憶」。對應原始職業系的核心 Tier 3，以及所有包含該系的跨系 Tier 3，都必須完成 Mastery；之後在 Region 4 可選神殿首次覺醒，並永久解鎖。'
          data['partyCompositionRule']['dualSectorClassesCountForBoth']=True
          data['partyCompositionRule']['sectorCountRangePerFourCharacterParty']='4-8'
          data['partyCompositionRule']['description']='隊伍被動依四名角色當前職業的 sectors 判定；單系職業貢獻 1 個 sector count，雙系 Tier 3 同時對兩個職業系各貢獻 1，因此四人隊伍總 sector count 介於 4～8。具體組合與效果目前不定義。'
          classes_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def write(path,text):
            (root/path).write_text(text,encoding='utf-8')
          def replace(path, old_s, new_s):
            p=root/path; t=p.read_text(encoding='utf-8')
            if old_s not in t: raise RuntimeError(f'marker missing: {path}: {old_s[:50]}')
            p.write_text(t.replace(old_s,new_s),encoding='utf-8')

          # Current source-of-truth docs.
          class_md='''# LEGACY COLLECTOR｜職業系統\n\n## 系統頁面責任\n\n本頁只負責呈現**職業結構與職業樹關係**：Tier 階層、四大職業系、轉職路徑、Tier 3 Inspiration Links、Tier 3 隱藏／揭露，以及四個角色記憶形態在職業樹外的位置關係。\n\n個別職業的一般攻擊、主動技能、被動技能、Charge、定位與 Mastery Checklist，統一放在「職業熟練系統」頁面與 `data/classes.json` 維護。\n\n## 職業階層\n\n- Tier 0：村民，只存在首次序章／教學。\n- Tier 1：基礎職業。\n- Tier 2：進階職業。\n- Tier 3：隱藏高階職業。\n\n四名主角的「XXX 的記憶」位於一般 Tier 圈之外，**不屬於 Tier 4**。\n\n## 四大職業系與雙系 Tier 3\n\n基礎職業系仍為戰士、敏捷、魔法、支援四系。Tier 1 / Tier 2 都是單系職業；Tier 3 則改為 **4 個單系核心 + 4 個跨系職業**。\n\n現行 8 個 Tier 3 每 45° 一個節點：\n\n- -135° 軍團守衛：支援 × 戰士\n- -90° 血煉騎士：戰士\n- -45° 斷罪士：戰士 × 敏捷\n- 0° 幻行師：敏捷\n- 45° 影刃術士：敏捷 × 魔法\n- 90° 空間魔導士：魔法\n- 135° 咒縛師：魔法 × 支援\n- 180° 聖律師：支援\n\n雙系 Tier 3 同時屬於兩個職業系，不需要在兩系之間二選一。\n\n## 一般轉職結構\n\n- Tier 0 → Tier 1：序章後進入基礎職業層。\n- Tier 1 → Tier 2：一般晉升依職業角度 ±45° 的合法範圍判定。\n- 同 Tier 的一般轉換依相鄰節點規則處理。\n- Tier 2 → Tier 3 不使用一般可逆轉職線，而以 Inspiration Links 表示解鎖與技能來源。\n\n## Tier 3 Inspiration Links\n\nInspiration Links 同時代表 Tier 3 的解鎖前置與完整技能繼承來源，不是可逆轉職路徑。\n\n- 軍團守衛：神官、吟遊詩人、煉金術士、騎士。\n- 血煉騎士：騎士、狂戰士、武士。\n- 斷罪士：狂戰士、武士、遊俠、刺客。\n- 幻行師：遊俠、刺客、舞刃者。\n- 影刃術士：刺客、舞刃者、魔劍士、巫師。\n- 空間魔導士：魔劍士、巫師、咒術師。\n- 咒縛師：巫師、咒術師、神官、吟遊詩人。\n- 聖律師：神官、吟遊詩人、煉金術士。\n\n## Tier 3 顯示規則\n\nTier 3 正式遊戲中在首次解鎖以前保持隱藏；Prototype 可以為設計與驗證提前顯示完整外圈。現行外圈固定為 **8 個 Tier 3**。舊版 16 節點版本已移至「舊版 / 已取消」。\n\n## 角色記憶與雙系職業\n\n角色記憶的「完成對應職業系全部 Tier 3 Mastery」會包含所有**涵蓋該系**的雙系職業。每個原始系目前各需要 3 個 Tier 3：\n\n- 戰士：軍團守衛、血煉騎士、斷罪士。\n- 敏捷：斷罪士、幻行師、影刃術士。\n- 魔法：影刃術士、空間魔導士、咒縛師。\n- 支援：咒縛師、聖律師、軍團守衛。\n\n## 職業樹 Prototype\n\n下方互動職業樹直接呈現 Tier 0～Tier 3、四大職業系、Tier 1 → Tier 2 一般連線、Tier 3 Inspiration Links，以及角色記憶的職業系要求。個別技能與 Mastery 不在本頁重複。\n'''
          write('docs/systems/class-system.md',class_md)

          mastery_md=(root/'docs/systems/mastery-system.md').read_text(encoding='utf-8')
          mastery_md=re.sub(r'- \*\*Tier 3\*\*：目前先顯示 16 個名稱／定位概念。.*?\n', '- **Tier 3**：現行固定為 8 個隱藏高階職業（4 個單系核心 + 4 個跨系）。Tier 3 完整繼承 Inspiration Links 對應 Tier 2 與祖先技能，再取得自己的專屬能力；專屬能力組合不強制固定格式。\n', mastery_md)
          mastery_md=mastery_md.replace('；戰將與獵刃武者目前皆採 **2 個專屬被動 + 0 個額外專屬主動**','')
          write('docs/systems/mastery-system.md',mastery_md)

          skill_path=root/'docs/systems/skill-system.md'; skill=skill_path.read_text(encoding='utf-8')
          skill=skill.replace('例如戰將的「橫掃」雖然仍是一般攻擊，但會同時攻擊左前方、正前方、右前方 3 格；這不視為額外被動技能。','例如軍團守衛的「戰槍」會攻擊前方直線 2 格；一般攻擊的形狀仍由各職業自行定義，且不視為額外被動技能。')
          skill=re.sub(r'- 戰將是第一個正式例外：.*?\n','- 空間魔導士是現行正式例外之一：使用 2 個 Tier 3 專屬主動技能，沒有額外 Tier 3 專屬被動；合法繼承技能仍全部保留。\n',skill)
          skill=skill.replace('戰將因沒有新增 Tier 3 專屬主動，所以不存在額外的 3 Charge 技能。','若個別 Tier 3 沒有新增專屬主動，就不會因此額外取得 3 Charge 技能。')
          skill=skill.replace('Tier 3 的 16 個職業節點目前先建立暫定名稱、職業定位與 Inspiration Links；後續逐職業設計時，依該職業玩法決定專屬能力組合，並使用完全職業專屬的 Mastery。','Tier 3 現行固定為 8 個職業節點：4 個單系核心與 4 個跨系職業。8 個職業皆已完成一般攻擊、專屬能力與 Mastery 設計。')
          write('docs/systems/skill-system.md',skill)

          philosophy=root/'docs/overview/design-philosophy.md'; t=philosophy.read_text(encoding='utf-8')
          t=t.replace('職業特性只是定位說明，不是技能。每個一般正式職業自身只提供 1 個主動技能與 1 個被動技能；高 Tier 透過完整技能繼承自然形成複合玩法。','職業特性只是定位說明，不是技能。Tier 1 / Tier 2 自身固定提供 1 個主動技能與 1 個被動技能；Tier 3 專屬能力組合依職業特色彈性設計，高 Tier 再透過完整技能繼承形成複合玩法。')
          t=t.replace('四名角色當前職業所屬職業系會形成隊伍職業組合，並在未來提供隊伍被動能力。','四名角色當前職業所屬職業系會形成隊伍職業組合，並在未來提供隊伍被動能力。單系職業貢獻 1 個 sector count；雙系 Tier 3 同時對兩系各貢獻 1，因此四人隊伍總 count 可由 4 變化至 8。')
          write('docs/overview/design-philosophy.md',t)

          # Party composition and memory rules.
          write('docs/systems/party-composition-system.md','''# 隊伍職業組合系統（Party Composition System）\n\n## 系統定位\n\n本系統用來承接取消裝備欄後的隊伍構築深度。四名角色目前所使用職業的職業系，會共同形成隊伍職業組合。\n\n## Sector Count 規則\n\n- 戰士、敏捷、魔法、支援仍是四個基礎職業系。\n- Tier 1 / Tier 2 與 Tier 3 單系核心職業，各自只貢獻 **1 個 sector count**。\n- 跨系 Tier 3 同時屬於兩系，**兩個職業系都各計 1**，不需要選擇其中一系。\n- 因此四名角色全部使用單系職業時，場上總共有 **4 個 sector count**。\n- 四名角色全部使用雙系 Tier 3 時，場上最多有 **8 個 sector count**。\n- 混合配置時總 count 介於 4～8。\n- Count 是職業系貢獻數，不等於角色數；同一角色使用雙系職業會同時增加兩系。\n\n例如：軍團守衛同時提供支援 +1、戰士 +1；斷罪士同時提供戰士 +1、敏捷 +1。\n\n## 判定依據\n\n判定依據是角色**當前職業的 `sectors`**，不是角色原始身份或記憶歸屬。角色轉職後立即重新計算。\n\n## 設計目的\n\n同一套已解鎖職業可以因四人配置不同而形成不同隊伍方向；雙系 Tier 3 讓隊伍組合的 sector count 從固定四個角色擴張為 4～8 的可變結構。\n\n## 尚未定義\n\n- 正式組合清單。\n- 被動名稱、效果與數值。\n- 不同 count 門檻如何觸發。\n- 多個組合效果是否能同時啟動。\n- 「XXX 的記憶」最終以哪些 sectors 參與組合判定。\n''')
          write('docs/systems/memory-awakening-system.md','''# 角色記憶覺醒系統（Memory Awakening System）\n\n## 系統定位\n\n四名主角各自原本代表戰士、敏捷、魔法、支援其中一個職業系。Tier 1～3 是重新理解力量的道路；四人都可以自由跨職業系發展。\n\n## 「XXX 的記憶」\n\n每名主角各有一個唯一最終記憶形態，不是 Tier 4，只允許對應角色本人使用。\n\n## 解鎖條件：雙系 Tier 3 也必須完成\n\n要首次覺醒某名角色的記憶，必須完成該角色原始職業系所涵蓋的**全部 Tier 3 Mastery**。這不只包含單系核心職業，也包含所有 `sectors` 中含有該系的跨系 Tier 3。\n\n現行要求：\n\n- 戰士記憶：軍團守衛 + 血煉騎士 + 斷罪士。\n- 敏捷記憶：斷罪士 + 幻行師 + 影刃術士。\n- 魔法記憶：影刃術士 + 空間魔導士 + 咒縛師。\n- 支援記憶：咒縛師 + 聖律師 + 軍團守衛。\n\n完成上述對應 Mastery 後，還必須在同一次 Run 抵達 Region 4 的合法「記憶神殿」類可選節點。\n\n## Region 4 神殿規則\n\n- 記憶神殿只出現在 Region 4，且不是必經路線。\n- 同一 Run 可覺醒多名角色，只要各自的 Tier 3 Mastery 與路線條件成立。\n- 神殿數量、生成方式與演出仍待 Region 4 設計。\n\n## 永久解鎖\n\n第一次成功覺醒後永久解鎖；之後新 Run 可由對應角色直接以自己的記憶開始，不需要再次前往 Region 4 神殿。\n\n## 尚未定義\n\n- 四名主角正式姓名與過去稱號。\n- 四個記憶形態的技能、一般攻擊、被動與 Charge。\n- 記憶形態在 Party Composition 中的最終 sectors。\n- 神殿正式名稱、視覺與生成規則。\n''')

          # Death/revival ordering.
          char_path=root/'docs/systems/character-system.md'; t=char_path.read_text(encoding='utf-8')
          t=t.replace('單次遠征中，角色死亡後從行動順序移除，且無法參與後續戰鬥。四名角色全部死亡時，本次 Run 失敗。','當角色 HP 降至 0 或以下時，先結算所有合法的死亡觸發／復活效果。若成功復活，角色不視為正式死亡並可繼續參與戰鬥；只有在所有復活效果結算後仍未復活，才從行動順序移除並視為正式死亡。四名角色在復活結算後全部正式死亡時，本次 Run 才失敗。聖律師「不滅聖契」是目前正式案例。')
          write('docs/systems/character-system.md',t)
          combat=root/'docs/systems/combat-system.md'; t=combat.read_text(encoding='utf-8')
          t=t.replace('5. 達成該戰鬥勝利條件，或隊伍全滅。','5. 單位 HP 歸零時先結算死亡觸發／復活；確認四名角色在復活結算後皆正式死亡，才判定隊伍全滅。')
          write('docs/systems/combat-system.md',t)
          exp=root/'docs/systems/expedition-system.md'; t=exp.read_text(encoding='utf-8')
          t=t.replace('四名角色全部死亡時該 Run 失敗；敘事上視為本次輪迴失敗。','四名角色在所有合法死亡觸發／復活效果結算後仍全部正式死亡時，該 Run 才失敗；敘事上視為本次輪迴失敗。')
          write('docs/systems/expedition-system.md',t)

          # Overview wording for dual-sector counts and memory requirements.
          for path in ['README.md','docs/overview/game-concept.md','docs/overview/gameplay-loop.md']:
            p=root/path; t=p.read_text(encoding='utf-8')
            t=t.replace('四人當前職業系組合','四人當前職業 sectors 組合')
            t=t.replace('四名角色當前職業所屬職業系','四名角色當前職業的 sectors')
            t=t.replace('每個職業系的全部 Tier 3 Mastery 完成後','每個原始職業系的核心 Tier 3 與所有涵蓋該系的雙系 Tier 3 Mastery 完成後')
            t=t.replace('對應職業系全部 Tier 3 Mastery','對應原始職業系的核心 Tier 3 與所有涵蓋該系的雙系 Tier 3 Mastery')
            p.write_text(t,encoding='utf-8')

          # Compact current GDD review; archived old per-class details remain in archive snapshot.
          gdd='''# LEGACY COLLECTOR｜GDD Review\n\n## Purpose\n\n此文件是現行 GDD 的一致性基準。舊版資料若與此頁衝突，以此頁、對應現行系統文件與 `data/classes.json` 為準。\n\n## Core Rules\n\n- 固定四名主角；無角色等級、自由能力配點與裝備欄。\n- Tier 0 村民只存在首次序章。Tier 1 / Tier 2 Mastery 為 3 共通 + 3 職業專屬；Tier 3 只驗證自身專屬能力。\n- Tier 2 完整繼承正式連線 Tier 1 主被動；Tier 3 完整繼承 Inspiration Links 對應 Tier 2 與祖先技能；一般攻擊不繼承。\n- Tier 3 全部是隱藏職業；現行固定 8 個，每 45° 一個節點。\n- 8 個 Tier 3：軍團守衛、血煉騎士、斷罪士、幻行師、影刃術士、空間魔導士、咒縛師、聖律師。\n- 單系核心：血煉騎士（戰士）、幻行師（敏捷）、空間魔導士（魔法）、聖律師（支援）。\n- 跨系：軍團守衛（支援×戰士）、斷罪士（戰士×敏捷）、影刃術士（敏捷×魔法）、咒縛師（魔法×支援）。\n- 雙系 Tier 3 在 Party Composition 同時對兩系各貢獻 1 count；四名角色總 sector count 因此介於 4～8。\n- 記憶覺醒必須完成原始職業系核心 Tier 3，以及所有涵蓋該系的雙系 Tier 3 Mastery。\n- 死亡時先結算死亡觸發／復活；所有復活結算後仍全員正式死亡才 Party Wipe。\n- 每個 Region 固定 1 個中段轉職點；目前職業必須 Mastered 才能轉出；轉職後合法主動技能 Charge 補滿。\n- 一般自身行動為移動 + 行動，可移動→行動或行動→移動；一般移動不可拆分；Wait 必須明確選擇。\n\n## Tier 3 Inspiration Links\n\n- 軍團守衛：神官、吟遊詩人、煉金術士、騎士。\n- 血煉騎士：騎士、狂戰士、武士。\n- 斷罪士：狂戰士、武士、遊俠、刺客。\n- 幻行師：遊俠、刺客、舞刃者。\n- 影刃術士：刺客、舞刃者、魔劍士、巫師。\n- 空間魔導士：魔劍士、巫師、咒術師。\n- 咒縛師：巫師、咒術師、神官、吟遊詩人。\n- 聖律師：神官、吟遊詩人、煉金術士。\n\n## Memory Requirements\n\n- 戰士：軍團守衛、血煉騎士、斷罪士。\n- 敏捷：斷罪士、幻行師、影刃術士。\n- 魔法：影刃術士、空間魔導士、咒縛師。\n- 支援：咒縛師、聖律師、軍團守衛。\n\n## Archive\n\nTier 3 舊 16 節點版本已封存於 `docs/archive/tier3-16-class-version.md` 與 `archive/tier3-16-class-version.json`，屬「舊版 / 已取消」，不得作現行規格來源。\n'''
          write('docs/development/gdd-review.md',gdd)
          docmap=root/'docs/development/document-map.md'; t=docmap.read_text(encoding='utf-8')
          t=t.replace('Relic／遺產系統、Reliquary／收藏館、Relic History、Legacy Trait、Relationship 等已取消設計只保留歷史參考。','Relic／遺產系統、Reliquary／收藏館、Relic History、Legacy Trait、Relationship，以及 Tier 3 舊 16 職業配置等已取消設計只保留歷史參考。\n\n- `docs/archive/tier3-16-class-version.md`：Tier 3 舊 16 節點說明。\n- `archive/tier3-16-class-version.json`：改版前完整 `classes.json` 快照。')
          write('docs/development/document-map.md',t)

          # Index: completed pages green + archive entry.
          idx=root/'index.html'; t=idx.read_text(encoding='utf-8')
          t=t.replace('<a class="status-progress" href="systems/class-system.html">職業系統</a>','<a class="status-confirmed" href="systems/class-system.html">職業系統</a>')
          t=t.replace('<a class="status-progress" href="systems/mastery-system.html">職業熟練系統</a>','<a class="status-confirmed" href="systems/mastery-system.html">職業熟練系統</a>')
          t=t.replace('<section class="group"><h2>舊版 / 已取消</h2>','<section class="group"><h2>舊版 / 已取消</h2><a href="development/tier3-16-class-archive.html">Tier 3 16 職業配置 · 舊版</a>')
          write('index.html',t)

          archive_html=f'''<!doctype html><html lang="zh-Hant" data-doc="../docs/archive/tier3-16-class-version.md?v={stamp}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tier 3 16 職業配置 · 舊版</title><link rel="stylesheet" href="../site.css?v={stamp}"></head><body><header class="topbar"><a class="brand" href="../index.html">LEGACY COLLECTOR</a><a href="../index.html">文件索引</a></header><main class="shell"><div class="eyebrow">ARCHIVE / CANCELLED</div><article class="doc" data-doc-content></article></main><script src="../site.js?v={stamp}"></script></body></html>'''
          write('development/tier3-16-class-archive.html',archive_html)

          # Class tree HTML: 8 nodes only, dual-sector labels/colors, explicit memory requirements.
          p=root/'systems/class-system.html'; h=p.read_text(encoding='utf-8')
          h=h.replace('Prototype 02 · 職業樹設計中','Prototype 02 · 職業樹已完成').replace('<span class="prototype-status progress">設計中</span>','<span class="prototype-status confirmed">已完成</span>')
          h=h.replace("for(let i=0;i<16;i++){let a=-157.5+i*22.5;if(J.some(j=>j.tier===3&&j.angle===a))continue;let s=a>=-45&&a<45?'agile':a>=45&&a<135?'magic':a>=135||a<-135?'support':'warrior';J.push({id:'tier3_hidden_'+(i+1),name:'？？？',tier:3,angle:a,sector:s,hidden:true,memory:false})}","")
          h=h.replace("const sectorNames={warrior:'戰士系',agile:'敏捷系',magic:'魔法系',support:'支援系',center:'序章'};","const sectorNames={warrior:'戰士系',agile:'敏捷系',magic:'魔法系',support:'支援系',center:'序章'};const sectorLabel=j=>(j.sectors||[j.sector]).map(s=>sectorNames[s]||s).join(' × ');")
          h=h.replace("memorySources=J.filter(x=>x.tier===3&&x.sector===j.sector);","memorySources=(j.requiredTier3Ids||[]).map(id=>J.find(x=>x.id===id)).filter(Boolean);")
          h=h.replace("<p><strong>職業系：</strong>${sectorNames[j.sector]||j.sector}</p>","<p><strong>職業系：</strong>${sectorLabel(j)}</p>")
          h=h.replace("g.setAttribute('class',`class-node ${j.sector} ${j.memory?'special':`tier${j.tier}`}${j.hidden?' hidden':''}`);","const mix=(j.sectors||[]).length>1?' mix-'+j.sectors.join('-'):'';g.setAttribute('class',`class-node ${j.sector} ${j.memory?'special':`tier${j.tier}`}${j.hidden?' hidden':''}${mix}`);")
          h=h.replace('v=20260828-2235',f'v={stamp}')
          write('systems/class-system.html',h)

          # Class mixed visual fills.
          css=root/'systems/class-system.css'; t=css.read_text(encoding='utf-8')
          t += '\n.class-node.mix-support-warrior circle{fill:url(#none);fill:#d9b8a6}.class-node.mix-warrior-agile circle{fill:#c7b9aa}.class-node.mix-agile-magic circle{fill:#b9c1c5}.class-node.mix-magic-support circle{fill:#c9c2bd}\n'
          write('systems/class-system.css',t)

          # Mastery browser: no placeholders, all 8 complete, dual-sector labels.
          p=root/'systems/mastery-system.html'; h=p.read_text(encoding='utf-8')
          h=h.replace('Prototype 03 · Tier 3 設計中','Prototype 03 · Tier 3 已完成').replace('<span class="prototype-status progress">設計中</span>','<span class="prototype-status confirmed">已完成</span>')
          h=re.sub(r'<p>Tier 3 已載入 16 個概念節點；.*?</p>','<p>Tier 3 現行固定為 8 個高階職業：4 個單系核心 + 4 個跨系；8 個職業的一般攻擊、專屬能力與 Mastery 均已完成確認。</p>',h)
          h=re.sub(r"for\(let i=0;i<16;i\+\+\)\{.*?\}\s*function cardFor",'function cardFor',h)
          h=h.replace("const sectorNames={warrior:'戰士系',agile:'敏捷系',magic:'魔法系',support:'支援系'};","const sectorNames={warrior:'戰士系',agile:'敏捷系',magic:'魔法系',support:'支援系'};const sectorLabel=c=>(c.sectors||[c.sector]).map(s=>sectorNames[s]||s).join(' × ');")
          h=h.replace("${esc(sectorNames[c.sector]||c.sector)}","${esc(sectorLabel(c))}")
          h=h.replace("${esc(sectorNames[c.sector]||'—')}","${esc(sectorLabel(c))}")
          h=h.replace("const damageNames={physical:'物理',magic:'魔法'};","const damageNames={physical:'物理',magic:'魔法',healing:'治療'};")
          h=h.replace("'straight-line-ranged':'直線遠距'","'straight-line-ranged':'直線遠距','melee-support':'近戰支援'")
          h=h.replace('v=20260828-2235',f'v={stamp}')
          write('systems/mastery-system.html',h)
          css=root/'systems/mastery-system.css'; t=css.read_text(encoding='utf-8')
          t=t.replace('.mastery-card.sector-support{background:#efe9d8}', '.mastery-card.sector-support{background:#efe9d8}.mastery-card.sector-warrior:has(.mastery-tier-label),.mastery-card.sector-agile:has(.mastery-tier-label),.mastery-card.sector-magic:has(.mastery-tier-label),.mastery-card.sector-support:has(.mastery-tier-label){background-blend-mode:multiply}')
          write('systems/mastery-system.css',t)

          # Bump GDD wrapper cache stamp.
          for path in ['development/gdd-review.html']:
            p=root/path; t=p.read_text(encoding='utf-8').replace('v=20260828-2235',f'v={stamp}'); p.write_text(t,encoding='utf-8')

          # Verify no active source-of-truth still declares 16 current Tier 3 or cancelled active classes.
          active_files=[root/'README.md']+list((root/'docs').rglob('*.md'))+list((root/'systems').glob('*.html'))+[root/'index.html']
          active_files=[p for p in active_files if 'archive' not in p.parts]
          bad=[]
          forbidden=['Tier 3 外圈保留 16','Tier 3 的 16 個職業節點','Tier 3 已載入 16','目前先顯示 16 個','戰將是第一個正式例外']
          for p in active_files:
            s=p.read_text(encoding='utf-8')
            for token in forbidden:
              if token in s: bad.append(f'{p}:{token}')
          if bad: raise RuntimeError('stale active Tier3 references: '+str(bad))
          # Data integrity.
          now=json.loads(classes_path.read_text(encoding='utf-8'))
          t3=[c for c in now['classes'] if c.get('tier')==3]
          assert len(t3)==8, len(t3)
          assert sorted(c['angle'] for c in t3)==[-135,-90,-45,0,45,90,135,180]
          assert all(now['classDesigns'].get(c['id'],{}).get('status')=='confirmed' for c in t3)
          assert all(len(m.get('requiredTier3Ids',[]))==3 for m in now['memoryForms'])
          assert (root/'archive/tier3-16-class-version.json').exists()
          assert (root/'development/tier3-16-class-archive.html').exists()

          # Remove this temporary workflow from final tree.
          Path('.github/workflows/apply-tier3-eight-class-restructure.yml').unlink()
      - name: Commit synchronized restructure
        run: |
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add -A
          git commit -m "Restructure Tier 3 into eight distinct classes"
          git push
