name: Update memory inheritance v61
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-memory-inheritance-v61.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python .github/scripts/update-memory-inheritance-v61.py
      - name: Commit migration
        run: |
          git config user.name "Johnny Muscovado"
          git config user.email "milk.lord@gmail.com"
          git add data/classes.json docs/systems/memory-awakening-system.md systems/memory-awakening-system.html docs/overview/design-philosophy.md docs/overview/gameplay-loop.md docs/development/gdd-review.md docs/systems/class-system.md systems/class-system.html docs/systems/party-composition-system.md
          git commit -m "Confirm full memory inheritance chain and fix Legion Guardian links"
          git rm .github/scripts/update-memory-inheritance-v61.py .github/workflows/update-memory-inheritance-v61.yml
          git commit -m "Remove memory inheritance migration helpers"
          git push
